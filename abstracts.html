     EDIT THESE FIVE LINES FOR EACH EVENT

     WhatsApp, Facebook and Google read these without running any
     JavaScript, so they cannot come from the Sheet. They are what
     shows when someone shares this link.

<script>
/* ═══════════════════════════════════════════════════════════════
   THE ONLY LINE YOU EVER EDIT
   Paste the /exec URL from Apps Script → Deploy → New deployment.
   Categories, word limit, deadline and themes all come from the Sheet.
   ═══════════════════════════════════════════════════════════════ */
const API_URL = "PASTE_YOUR_EXEC_URL_HERE";
</script>

<style>
:root{
  --ink:#0B1524; --slate:#4A5B72; --mist:#8A9AAF; --line:#E2E8F0;
  --bg:#F5F8FC; --card:#FFFFFF;
  --brand:#2B46D4; --brand-dark:#1E2F9E; --brand-soft:#EEF1FE; --sky:#0E9DE5;
  --grad:linear-gradient(130deg,#2B46D4,#0E9DE5);
  --go:#10B981; --amber:#F59E0B; --red:#DC2626;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
     background:var(--bg);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased;
     padding:20px 16px 60px}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto}

.head{background:var(--grad);color:#fff;border-radius:20px 20px 0 0;padding:28px 26px 24px}
.head .kick{font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;opacity:.85;font-weight:700}
.head h1{font-size:1.5rem;font-weight:800;letter-spacing:-.025em;line-height:1.2;margin:8px 0}
.head .meta{font-size:.88rem;opacity:.92}
.card{background:var(--card);border-radius:0 0 20px 20px;padding:28px 26px 30px;
      box-shadow:0 18px 44px -18px rgba(11,21,36,.28)}

.banner{display:flex;gap:10px;align-items:flex-start;border-radius:12px;
        padding:13px 15px;margin-bottom:22px;font-size:.88rem}
.banner.info{background:var(--brand-soft);border:1px solid #C9D3F6;color:var(--brand-dark)}
.banner.warn{background:#FEF6E7;border:1px solid #F5D9A8;color:#8A5A08}
.themes{font-size:.86rem;color:var(--slate);background:#F8FAFD;border:1px solid var(--line);
        border-radius:12px;padding:14px 16px;margin-bottom:22px}
.themes b{color:var(--ink);display:block;margin-bottom:4px;font-size:.72rem;
          letter-spacing:.12em;text-transform:uppercase}

h2{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mist);
   font-weight:800;margin:28px 0 12px;padding-top:18px;border-top:1px solid var(--line)}
h2:first-of-type{margin-top:0;padding-top:0;border-top:none}

.field{margin-bottom:16px}
label{display:block;font-size:.87rem;font-weight:700;margin-bottom:6px}
label .opt{font-weight:500;color:var(--mist)}
label .hint{display:block;font-weight:500;color:var(--mist);font-size:.8rem;margin-top:2px}
input[type=text],input[type=email],input[type=tel],select,textarea{
  width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:11px;
  font:inherit;font-size:.96rem;background:#fff;color:var(--ink)}
textarea{min-height:110px;resize:vertical;line-height:1.55}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);
  box-shadow:0 0 0 3px rgba(43,70,212,.11)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.two{grid-template-columns:1fr}}
.hp{position:absolute;left:-9999px}

.count{display:flex;justify-content:space-between;align-items:baseline;margin-top:5px;
       font-size:.78rem;color:var(--mist)}
.count .n{font-family:"IBM Plex Mono",monospace}
.total{position:sticky;bottom:0;background:var(--card);border-top:2px solid var(--line);
       margin:24px -26px -30px;padding:16px 26px 20px}
.bar{height:6px;background:var(--line);border-radius:999px;overflow:hidden;margin-bottom:10px}
.bar i{display:block;height:100%;background:var(--go);width:0;transition:width .2s,background .2s}
.bar.over i{background:var(--red)}
.total .row{display:flex;justify-content:space-between;align-items:center;font-size:.88rem}
.total .row b{font-size:1.05rem;font-family:"IBM Plex Mono",monospace}
.total.over .row b{color:var(--red)}

.btn{width:100%;margin-top:14px;padding:16px;border:none;border-radius:13px;background:var(--grad);
     color:#fff;font-family:inherit;font-weight:700;font-size:1rem;cursor:pointer;
     box-shadow:0 6px 18px rgba(43,70,212,.3)}
.btn:hover{filter:brightness(1.07)}
.btn:disabled{opacity:.6;cursor:not-allowed;filter:none}
.msg{margin-top:12px;font-size:.9rem;font-weight:600;min-height:1.2em;text-align:center}

.state{background:var(--card);border-radius:20px;padding:44px 28px;text-align:center;
       box-shadow:0 18px 44px -18px rgba(11,21,36,.28)}
.state h1{font-size:1.25rem;margin-bottom:10px}
.state p{color:var(--slate);font-size:.94rem}
.done .tick{width:62px;height:62px;border-radius:50%;background:var(--go);color:#fff;
            display:flex;align-items:center;justify-content:center;font-size:2rem;margin:0 auto 18px}
.done h1{font-size:1.45rem;font-weight:800;letter-spacing:-.02em;margin-bottom:8px}
.refbox{background:var(--brand-soft);border:2px dashed var(--brand);border-radius:14px;
        padding:18px;margin:22px 0}
.refbox .lbl{font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;
             color:var(--brand-dark);font-weight:800}
.refbox .ref{font-size:1.6rem;font-weight:800;letter-spacing:.08em;margin:6px 0 2px;color:var(--brand-dark)}
.editbox{text-align:left;border:1.5px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.editbox h3{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mist);
            font-weight:800;margin-bottom:8px}
.editbox a{color:var(--brand);font-weight:600;word-break:break-all;font-size:.86rem}
.foot{text-align:center;margin-top:22px;font-size:.78rem;color:var(--mist)}
.foot a{color:var(--brand);text-decoration:none;font-weight:600}
.diag{margin-top:20px;padding:14px 16px;background:#FEF6E7;border:1px solid #F5D9A8;
      border-radius:12px;font-size:.82rem;color:#7A4E06;text-align:left;line-height:1.5}
.hide{display:none}
.already{background:#F8FAFD;border:1.5px solid var(--line);border-radius:14px;
         padding:16px 18px;margin-bottom:20px}
.already h3{font-size:.95rem;font-weight:800;margin-bottom:5px}
.already p{font-size:.86rem;color:var(--slate);margin-bottom:0}
.already .inner{margin-top:12px}
.already input{margin-bottom:8px}
.already button{width:100%;padding:11px;border:1.5px solid var(--line);border-radius:11px;
                background:#fff;font-family:inherit;font-weight:700;font-size:.88rem;
                color:var(--ink);cursor:pointer}
.already button:hover{border-color:var(--brand);color:var(--brand)}
.already .link{background:none;border:none;color:var(--brand);font-weight:700;
               font-size:.86rem;cursor:pointer;padding:0;text-decoration:underline;width:auto}
.newhdr{border-top:2px solid var(--line);margin:4px 0 20px;padding-top:18px}
.newhdr h3{font-size:1.02rem;font-weight:800;margin-bottom:4px}
.newhdr p{font-size:.86rem;color:var(--slate)}
.logos{display:flex;gap:14px;justify-content:center;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.logos img{height:64px;width:auto;max-width:130px;object-fit:contain;
           background:#fff;border-radius:12px;padding:7px}
@media(max-width:480px){.logos img{height:52px}}

.linkbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.linkbar a{flex:1 1 auto;min-width:140px;text-align:center;padding:11px 14px;border-radius:11px;
           border:1.5px solid var(--line);background:#fff;color:var(--slate);
           text-decoration:none;font-weight:700;font-size:.86rem}
.linkbar a:hover{border-color:var(--brand);color:var(--brand)}
.linkbar a.primary{background:var(--brand-soft);border-color:#C9D3F6;color:var(--brand-dark)}
.crosscta{margin-top:18px;padding:18px;border:2px solid var(--brand);border-radius:14px;
          background:var(--brand-soft);text-align:left}
.crosscta h3{font-size:.95rem;font-weight:800;color:var(--brand-dark);margin-bottom:6px}
.crosscta p{font-size:.87rem;color:var(--slate);margin-bottom:12px}
.crosscta a{display:block;padding:13px;border-radius:11px;background:var(--grad);color:#fff;
            text-align:center;text-decoration:none;font-weight:700;font-size:.94rem}

.guide{font-size:.85rem;color:var(--slate);margin:-4px 0 12px}
.addbtn{width:100%;padding:11px;border:1.5px dashed var(--line);border-radius:11px;background:#fff;
        font-family:inherit;font-weight:700;font-size:.88rem;color:var(--brand);cursor:pointer;margin-bottom:6px}
.addbtn:hover{border-color:var(--brand);background:var(--brand-soft)}
.rowitem{display:flex;gap:8px;align-items:flex-start;margin-bottom:8px}
.rownum{flex:0 0 26px;height:42px;display:flex;align-items:center;justify-content:center;
        font-family:"IBM Plex Mono",monospace;font-weight:500;color:var(--mist);font-size:.9rem}
.rowitem input{flex:1}
.del{flex:0 0 38px;height:42px;border:1.5px solid var(--line);border-radius:10px;background:#fff;
     color:var(--mist);font-size:1.1rem;cursor:pointer;line-height:1}
.del:hover{border-color:#E5A3A3;color:#B03A3A}
.authrow{border:1.5px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px;background:#fff}
.authtop{display:flex;gap:8px;align-items:center}
.authtop input{flex:1}
.affpick{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px;align-items:center}
.affpick .lbl{font-size:.78rem;color:var(--mist);margin-right:2px}
.chip{min-width:32px;height:30px;padding:0 9px;border:1.5px solid var(--line);border-radius:8px;
      background:#fff;font-family:"IBM Plex Mono",monospace;font-size:.85rem;color:var(--slate);cursor:pointer}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700}
.presrow{display:flex;align-items:center;gap:8px;margin-top:9px;font-size:.84rem;color:var(--slate)}
.presrow input{width:17px;height:17px;accent-color:var(--brand)}
.preview{margin-top:10px;padding:13px 15px;background:#F8FAFD;border:1px solid var(--line);
         border-radius:12px;font-size:.9rem;line-height:1.6}
.preview .ttl{font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mist);
              font-weight:800;margin-bottom:6px}
.preview .affs{font-size:.82rem;color:var(--slate);margin-top:8px;white-space:pre-line}
.lost{margin-top:22px;padding:16px 18px;background:#F8FAFD;border:1px solid var(--line);
      border-radius:14px;text-align:left}
.lost h3{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mist);
         font-weight:800;margin-bottom:8px}
.lost p{font-size:.86rem;color:var(--slate);margin-bottom:10px}
.lost input{margin-bottom:8px}
.lost button{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:11px;
             background:#fff;font-family:inherit;font-weight:700;font-size:.9rem;
             color:var(--ink);cursor:pointer}
.lost button:hover{border-color:var(--brand);color:var(--brand)}
.danger{margin-top:18px;padding:16px 18px;border:1.5px solid #F3C9C9;background:#FDF5F5;
        border-radius:14px;text-align:left}
.danger h3{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:#B03A3A;
           font-weight:800;margin-bottom:6px}
.danger p{font-size:.85rem;color:var(--slate);margin-bottom:10px}
.danger button{width:100%;padding:12px;border:1.5px solid #E5A3A3;border-radius:11px;
               background:#fff;color:#B03A3A;font-family:inherit;font-weight:700;
               font-size:.9rem;cursor:pointer}
.danger button:hover{background:#B03A3A;color:#fff;border-color:#B03A3A}
.restore{border-color:#C9D3F6;background:var(--brand-soft)}
.restore h3{color:var(--brand-dark)}
.restore button{border-color:#C9D3F6;color:var(--brand-dark)}
.restore button:hover{background:var(--brand);color:#fff;border-color:var(--brand)}
</style>

<body>
<div class="wrap" id="root">
  <div class="state"><h1>Loading…</h1><p>One moment.</p></div>
</div>

<script>
(function(){
  var root = document.getElementById('root');
  var cfg = null, editToken = null, existing = null;

  function esc(s){
    return String(s==null?'':s).replace(/[&<>"]/g,function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
    });
  }

  // Links to this event's other pages, all from the Sheet

  function logoStrip(){
    var L = (cfg && cfg.links && cfg.links.logos) || [];
    if (!L.length) return '';
    return '<div class="logos">' + L.map(function(u){
      return '<img src="' + esc(u) + '" alt="" loading="lazy">';
    }).join('') + '</div>';
  }

  function linkBar(current){
    var L = (cfg && cfg.links) || {};
    var out = [];
    if (L.register && current !== 'register')
      out.push('<a href="' + esc(L.register) + '"' + (L.registrationOpen ? ' class="primary"' : '') +
               '>Register for the conference</a>');
    if (L.abstracts && current !== 'abstracts')
      out.push('<a href="' + esc(L.abstracts) + '"' + (L.abstractsOpen ? ' class="primary"' : '') +
               '>Submit an abstract</a>');
    if (L.app) out.push('<a href="' + esc(L.app) + '">Conference app</a>');
    if (L.site) out.push('<a href="' + esc(L.site) + '">Association website</a>');
    return out.length ? '<div class="linkbar">' + out.join('') + '</div>' : '';
  }

  function state(html, withLost){
    root.innerHTML = '<div class="state">' + html +
      (withLost ? lostBlock() : '') + '</div>';
    if (withLost) wireLost();
  }

  function lostBlock(){
    return '<div class="lost"><h3>Lost your edit link?</h3>' +
      '<p>Enter the email address you submitted with and we will send it again.</p>' +
      '<input id="lostEmail" type="email" placeholder="you@example.com" autocomplete="email">' +
      '<button id="lostGo">Email me my link</button>' +
      '<p class="msg" id="lostMsg" style="text-align:left;margin-top:8px"></p></div>';
  }

  function wireLost(){
    var btn = document.getElementById('lostGo');
    if (!btn || btn.dataset.wired) return;
    btn.dataset.wired = '1';
    btn.addEventListener('click', function(){
      var em = document.getElementById('lostEmail').value.trim();
      var m = document.getElementById('lostMsg');
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){
        m.style.color = 'var(--red)'; m.textContent = 'Please enter a valid email address.'; return;
      }
      btn.disabled = true; btn.textContent = 'Sending…'; m.textContent = '';
      fetch(API_URL, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' },
                       body: JSON.stringify({ action:'resendabstract', email:em }) })
        .then(function(r){ return r.json(); })
        .then(function(res){
          m.style.color = res && res.ok ? 'var(--go)' : 'var(--red)';
          m.textContent = res && res.ok
            ? 'If an abstract was submitted with that address, the link is on its way.'
            : ((res && res.error) || 'Could not send. Please try again.');
        })
        .catch(function(){ m.style.color='var(--red)'; m.textContent='Could not reach the server.'; })
        .then(function(){ btn.disabled = false; btn.textContent = 'Email me my link'; });
    });
  }
  function words(t){
    t = String(t||'').replace(/\s+/g,' ').trim();
    return t ? t.split(' ').length : 0;
  }
  function $(id){ return document.getElementById(id); }

  // Each association can set its own colour in the Sheet
  function applyBrand(hex){
    if (!/^#[0-9a-fA-F]{6}$/.test(String(hex||''))) return;
    var r = parseInt(hex.substr(1,2),16), g = parseInt(hex.substr(3,2),16), b = parseInt(hex.substr(5,2),16);
    var lighten = function(v){ return Math.min(255, Math.round(v + (255-v)*0.35)); };
    var second = '#' + [lighten(r),lighten(g),lighten(b)]
                        .map(function(v){ return ('0'+v.toString(16)).slice(-2); }).join('');
    var root = document.documentElement;
    root.style.setProperty('--brand', hex);
    root.style.setProperty('--sky', second);
    root.style.setProperty('--grad', 'linear-gradient(130deg,' + hex + ',' + second + ')');
    root.style.setProperty('--brand-soft', 'rgba(' + r + ',' + g + ',' + b + ',0.08)');
    root.style.setProperty('--brand-dark', hex);
    var meta = document.querySelector('meta[name=theme-color]');
    if (meta) meta.setAttribute('content', hex);
  }

  // "#edit=TOKEN" means an author coming back to their own submission
  var frag = location.hash.replace(/^#/,'');
  if (frag.indexOf('edit=') === 0) editToken = frag.slice(5);

  if (!API_URL || API_URL.indexOf('PASTE') === 0){
    state('<h1>Not configured yet</h1><p>The API URL has not been set in this page.</p>');
    return;
  }

  fetch(API_URL + '?action=abstractconfig')
    .then(function(r){
      return r.text().then(function(txt){
        if (txt.indexOf('<') === 0) throw { detail:'The Apps Script deployment is not public. ' +
          'In Apps Script: Deploy \u2192 Manage deployments \u2192 pencil \u2192 Who has access: Anyone \u2192 Deploy.' };
        var c;
        try { c = JSON.parse(txt); } catch(e){ throw { detail:'Server did not return valid data.' }; }
        if (!c || !c.ok) throw { detail:(c && c.error) || 'Unknown problem.' };
        return c;
      });
    })
    .then(function(c){
      cfg = c;
      applyBrand(c.brand);
      if (editToken) return loadExisting();
      if (!c.open){
        state('<h1>' + (c.deadlinePassed ? 'The deadline has passed' : 'Abstract submission is not open') +
              '</h1><p>' + (c.deadlinePassed
                ? 'Abstracts for ' + esc(c.event) + ' closed on ' + esc(c.deadline) + '.'
                : 'Submission for ' + esc(c.event) + ' has not opened yet.') +
              ' Please contact the scientific committee.</p>', c.deadlinePassed);
        return;
      }
      draw();
    })
    .catch(function(err){
      state('<h1>Could not load the form</h1><p>Please contact the organisers.</p>' +
            '<div class="diag"><b>For the organiser:</b><br>' +
            esc((err && err.detail) || 'Could not reach the server.') + '</div>');
    });

  function loadExisting(){
    return fetch(API_URL + '?action=abstract&token=' + encodeURIComponent(editToken))
      .then(function(r){ return r.json(); })
      .then(function(a){
        if (!a || !a.ok){
          state('<h1>Abstract not found</h1><p>' + esc((a && a.error) || '') +
                '</p><p style="margin-top:12px">Open the link exactly as it appears in your email.</p>', true);
          return;
        }
        existing = a;
        if (a.status === 'Withdrawn'){
          root.innerHTML =
            '<div class="state">' +
              '<h1>' + esc(a.absid) + ' \u2014 withdrawn</h1>' +
              '<p><b>' + esc(a.title) + '</b></p>' +
              '<p style="margin-top:12px">This abstract has been withdrawn and will not be reviewed.</p>' +
              '<div class="danger restore"><h3>Changed your mind?</h3>' +
              '<p>You can reinstate it up to the deadline, and edit it as normal afterwards.</p>' +
              '<button id="restoreBtn">Reinstate this abstract</button>' +
              '<p class="msg" id="wMsg2" style="text-align:left;margin-top:8px"></p></div>' +
            '</div>';
          document.getElementById('restoreBtn').addEventListener('click', function(){
            doWithdraw(true, this, document.getElementById('wMsg2'));
          });
          return;
        }
        if (a.locked){
          state('<h1>' + esc(a.absid) + '</h1><p><b>' + esc(a.title) + '</b></p>' +
                '<p style="margin-top:12px">The deadline has passed, so this abstract can no longer ' +
                'be edited. You will be notified of the outcome after review.</p>');
          return;
        }
        draw();
      });
  }

  function draw(){
    var e = existing || {};
    var cats = (cfg.categories||[]).map(function(c){
      return '<option value="' + esc(c) + '"' + (e.category === c ? ' selected' : '') + '>' + esc(c) + '</option>';
    }).join('');

    var presOpts = [''].concat(cfg.presentationOptions || []);
    var pres = cfg.askPresentation ?
      '<div class="field"><label for="f-pres">Preferred presentation type</label>' +
      '<select id="f-pres">' +
      presOpts.map(function(o){
        return '<option value="' + esc(o) + '"' + (e.presentation === o ? ' selected' : '') + '>' +
               (o || 'Choose…') + '</option>';
      }).join('') +
      '</select><label class="hint" style="font-weight:500">The scientific committee makes the final decision.</label></div>' : '';

    // One textarea per configured heading — structured or not
    var secVals = (e.sections || []);
    var structured = (cfg.sections || []).length > 1;
    var secFields = (cfg.sections || []).map(function(label, i){
      return '<div class="field"><label for="f-s' + i + '">' + esc(label) + '</label>' +
        '<textarea id="f-s' + i + '" class="wc">' + esc(secVals[i]||'') + '</textarea>' +
        '<div class="count"><span>' + (i === 0 && structured ? 'Structured abstract' : '') +
        '</span><span class="n" id="c-s' + i + '">0 words</span></div></div>';
    }).join('');

    var ethics = cfg.requireEthics ?
      '<div class="field"><label for="f-ethics">Ethics approval' +
      '<span class="hint">State the approving body and reference number, or explain why approval was not required.</span></label>' +
      '<textarea id="f-ethics" style="min-height:76px">' + esc(e.ethics||'') + '</textarea></div>' : '';

    root.innerHTML =
      logoStrip() +
      '<div class="head">' +
        '<div class="kick">' + (editToken ? 'Edit your abstract' : 'Call for abstracts') + '</div>' +
        '<h1>' + esc(cfg.event) + '</h1>' +
        '<div class="meta">' + esc(cfg.dates) + (cfg.venue ? ' &middot; ' + esc(cfg.venue) : '') + '</div>' +
      '</div>' +
      '<div class="card">' +
        linkBar('abstracts') +

        (editToken ? '' :
          '<div class="already"><h3>Already submitted an abstract?</h3>' +
          '<p>Use the link in your confirmation email to view or edit it \u2014 don\u2019t fill this form again. ' +
          '<button type="button" class="link" id="lostOpen">Lost the link?</button></p>' +
          '<div class="inner hide" id="lostInner">' +
            '<input id="lostEmail" type="email" placeholder="The email you submitted with" autocomplete="email">' +
            '<button type="button" id="lostGo">Email me my link</button>' +
            '<p class="msg" id="lostMsg" style="text-align:left;margin-top:8px"></p>' +
          '</div></div>' +

          '<div class="newhdr"><h3>New submission</h3>' +
          '<p>Fill in the form below only if this is a new abstract.</p></div>') +

        (editToken ? '<div class="banner info"><span>\u270E</span><span>You are editing <b>' +
          esc(e.absid) + '</b>. Changes are saved when you press the button at the bottom.</span></div>' : '') +

        (cfg.deadline ? '<div class="banner warn"><span>\u23F0</span><span>' +
          (editToken ? 'You can edit until <b>' : 'Submission closes <b>') +
          esc(cfg.deadline) + '</b>.</span></div>' : '') +

        (cfg.themes ? '<div class="themes"><b>Conference themes</b>' + esc(cfg.themes) + '</div>' : '') +

        '<h2>Institutions</h2>' +
        '<p class="guide">List every institution involved. They are numbered automatically, ' +
          'and you link each author to their institution(s) below.</p>' +
        '<div id="affList"></div>' +
        '<button type="button" class="addbtn" id="addAff">+ Add institution</button>' +

        '<h2>Authors</h2>' +
        '<p class="guide">Add authors in the order they should appear. Tap the numbers to link ' +
          'each author to their institution(s). Mark who will present.</p>' +
        '<div id="authList"></div>' +
        '<button type="button" class="addbtn" id="addAuth">+ Add author</button>' +
        '<div class="preview" id="authPreview"></div>' +

        '<h2>Contact for this abstract</h2>' +
        '<div class="two">' +
          '<div class="field"><label for="f-email">Email</label>' +
            '<input id="f-email" type="email" autocomplete="email" value="' + esc(e.email||'') + '"' +
            (editToken ? ' readonly style="background:#F1F5F9;color:var(--mist)"' : '') + '></div>' +
          '<div class="field"><label for="f-phone">Phone <span class="opt">(optional)</span></label>' +
            '<input id="f-phone" type="tel" value="' + esc(e.phone||'') + '"></div>' +
        '</div>' +

        '<h2>Abstract</h2>' +
        '<div class="field"><label for="f-title">Title</label>' +
          '<input id="f-title" type="text" value="' + esc(e.title||'') + '"></div>' +
        '<div class="field"><label for="f-cat">Category</label>' +
          '<select id="f-cat"><option value="">Choose a category…</option>' + cats + '</select></div>' +
        pres +

        secFields +

        (cfg.requireEthics || cfg.requireConflicts ? '<h2>Declarations</h2>' : '') +
        ethics +
        (cfg.requireConflicts ?
          '<div class="field"><label for="f-conf">Conflicts of interest' +
          '<span class="hint">Write "None" if there are none.</span></label>' +
          '<textarea id="f-conf" style="min-height:70px">' + esc(e.conflicts||'') + '</textarea></div>' : '') +

        '<input class="hp" type="text" id="f-web" tabindex="-1" autocomplete="off" aria-hidden="true">' +

        '<div class="total" id="totalBox">' +
          '<div class="bar" id="bar"><i id="barFill"></i></div>' +
          '<div class="row"><span>Word count' +
            (cfg.wordLimit ? ' (limit ' + cfg.wordLimit + ')' : '') + '</span>' +
            '<b id="wTotal">0</b></div>' +
          '<button class="btn" id="go">' +
            (editToken ? 'Save changes' : 'Submit abstract') + '</button>' +
          '<p class="msg" id="msg"></p>' +
        '</div>' +
      '</div>' +
      (editToken ?
        '<div class="danger" style="margin-top:18px"><h3>Withdraw this abstract</h3>' +
        '<p>It will not be reviewed. You can reinstate it up to the deadline.</p>' +
        '<button id="wdBtn">Withdraw ' + esc(e.absid || 'this abstract') + '</button>' +
        '<p class="msg" id="wMsg" style="text-align:left;margin-top:8px"></p></div>' : '') +
      '<p class="foot">Powered by <a href="https://confhub.ng">ConfHub.ng</a></p>';

    if (editToken){
      var wd = document.getElementById('wdBtn');
      if (wd) wd.addEventListener('click', function(){
        if (!confirm('Withdraw this abstract? It will not be reviewed.\n\nYou can reinstate it before the deadline.')) return;
        doWithdraw(false, wd, document.getElementById('wMsg'));
      });
    }

    affs = (e.affiliations && e.affiliations.length) ? e.affiliations.slice() : [''];
    auths = (e.authors && e.authors.length) ? e.authors.map(function(a){
      return { name:a.name||'', affs:(a.affs||[]).slice(), presenting:!!a.presenting };
    }) : [{ name:'', affs:[1], presenting:true }];
    if (!auths.some(function(a){ return a.presenting; })) auths[0].presenting = true;
    drawAffs();

    var lo = $('lostOpen');
    if (lo) lo.addEventListener('click', function(){
      var box = $('lostInner');
      box.className = box.className.indexOf('hide') !== -1 ? 'inner' : 'inner hide';
      if (box.className === 'inner') $('lostEmail').focus();
    });
    wireLost();

    $('addAff').addEventListener('click', function(){ affs.push(''); drawAffs(); });
    $('addAuth').addEventListener('click', function(){
      auths.push({ name:'', affs:[], presenting:false }); drawAuths();
    });

    (cfg.sections || []).forEach(function(_, i){
      var el = $('f-s' + i);
      if (el) el.addEventListener('input', recount);
    });
    $('go').addEventListener('click', submit);
    recount();
  }

  function doWithdraw(restore, btn, msg){
    btn.disabled = true;
    btn.textContent = restore ? 'Reinstating…' : 'Withdrawing…';
    if (msg) msg.textContent = '';
    fetch(API_URL, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' },
                     body: JSON.stringify({ action:'withdrawabstract', token:editToken, restore:restore }) })
      .then(function(r){ return r.json(); })
      .then(function(res){
        if (!res || !res.ok){
          if (msg){ msg.style.color='var(--red)'; msg.textContent = (res && res.error) || 'Could not complete that.'; }
          btn.disabled = false;
          btn.textContent = restore ? 'Reinstate this abstract' : 'Withdraw this abstract';
          return;
        }
        location.reload();
      })
      .catch(function(){
        if (msg){ msg.style.color='var(--red)'; msg.textContent = 'Could not reach the server.'; }
        btn.disabled = false;
        btn.textContent = restore ? 'Reinstate this abstract' : 'Withdraw this abstract';
      });
  }

  /* ── Institutions and authors ─────────────────────────────── */
  var affs = [], auths = [];
  var SUPS = ['\u2070','\u00B9','\u00B2','\u00B3','\u2074','\u2075','\u2076','\u2077','\u2078','\u2079'];
  function sup(n){ return String(n).split('').map(function(d){ return SUPS[+d] || d; }).join(''); }

  function drawAffs(){
    var box = $('affList');
    box.innerHTML = affs.map(function(a, i){
      return '<div class="rowitem">' +
        '<span class="rownum">' + (i+1) + '.</span>' +
        '<input type="text" data-aff="' + i + '" placeholder="Institution, city" value="' + esc(a) + '">' +
        (affs.length > 1 ? '<button type="button" class="del" data-delaff="' + i + '">\u00D7</button>' : '') +
        '</div>';
    }).join('');
    box.querySelectorAll('[data-aff]').forEach(function(el){
      el.addEventListener('input', function(){ affs[+this.dataset.aff] = this.value; drawPreview(); });
    });
    box.querySelectorAll('[data-delaff]').forEach(function(el){
      el.addEventListener('click', function(){
        var n = +this.dataset.delaff;
        affs.splice(n, 1);
        // renumber every author's links so nothing points at a gap
        auths.forEach(function(a){
          a.affs = (a.affs||[]).filter(function(x){ return x !== n+1; })
                               .map(function(x){ return x > n+1 ? x-1 : x; });
        });
        drawAffs(); drawAuths();
      });
    });
    drawAuths();
  }

  function drawAuths(){
    var box = $('authList');
    box.innerHTML = auths.map(function(a, i){
      var chips = affs.map(function(_, j){
        var on = (a.affs||[]).indexOf(j+1) !== -1;
        return '<button type="button" class="chip' + (on ? ' on' : '') +
               '" data-auth="' + i + '" data-aff="' + (j+1) + '">' + (j+1) + '</button>';
      }).join('');
      return '<div class="authrow">' +
        '<div class="authtop">' +
          '<input type="text" data-name="' + i + '" placeholder="Author full name" value="' + esc(a.name||'') + '">' +
          (auths.length > 1 ? '<button type="button" class="del" data-delauth="' + i + '">\u00D7</button>' : '') +
        '</div>' +
        '<div class="affpick"><span class="lbl">Institution:</span>' + chips + '</div>' +
        '<label class="presrow"><input type="radio" name="presenting" data-pres="' + i + '"' +
          (a.presenting ? ' checked' : '') + '> Presenting author</label>' +
      '</div>';
    }).join('');

    box.querySelectorAll('[data-name]').forEach(function(el){
      el.addEventListener('input', function(){ auths[+this.dataset.name].name = this.value; drawPreview(); });
    });
    box.querySelectorAll('.chip').forEach(function(el){
      el.addEventListener('click', function(){
        var a = auths[+this.dataset.auth], n = +this.dataset.aff;
        a.affs = a.affs || [];
        var at = a.affs.indexOf(n);
        if (at === -1) a.affs.push(n); else a.affs.splice(at, 1);
        a.affs.sort(function(x,y){ return x-y; });
        drawAuths();
      });
    });
    box.querySelectorAll('[data-delauth]').forEach(function(el){
      el.addEventListener('click', function(){
        var wasPres = auths[+this.dataset.delauth].presenting;
        auths.splice(+this.dataset.delauth, 1);
        if (wasPres && auths.length) auths[0].presenting = true;
        drawAuths();
      });
    });
    box.querySelectorAll('[data-pres]').forEach(function(el){
      el.addEventListener('change', function(){
        auths.forEach(function(a, i){ a.presenting = (i === +el.dataset.pres); });
        drawPreview();
      });
    });
    drawPreview();
  }

  function drawPreview(){
    var box = $('authPreview');
    if (!box) return;
    var named = auths.filter(function(a){ return String(a.name||'').trim(); });
    if (!named.length){ box.innerHTML = ''; return; }
    var line = named.map(function(a){
      var f = (a.affs||[]).filter(Boolean);
      return esc(a.name.trim()) + (f.length ? f.map(sup).join(',') : '');
    }).join(', ');
    var affLines = affs.filter(function(x){ return String(x||'').trim(); })
                       .map(function(x, i){ return (i+1) + '. ' + x.trim(); }).join('\n');
    box.innerHTML = '<div class="ttl">How this will appear</div>' + line +
                    (affLines ? '<div class="affs">' + esc(affLines) + '</div>' : '');
  }

  function recount(){
    var total = 0;
    (cfg.sections || []).forEach(function(_, i){
      var el = $('f-s' + i), lab = $('c-s' + i);
      if (!el) return;
      var n = words(el.value);
      total += n;
      if (lab) lab.textContent = n + (n === 1 ? ' word' : ' words');
    });
    $('wTotal').textContent = total + (cfg.wordLimit ? ' / ' + cfg.wordLimit : '');
    if (cfg.wordLimit){
      var pct = Math.min(100, Math.round(total / cfg.wordLimit * 100));
      $('barFill').style.width = pct + '%';
      var over = total > cfg.wordLimit;
      $('bar').className = 'bar' + (over ? ' over' : '');
      $('totalBox').className = 'total' + (over ? ' over' : '');
    }
  }

  function submit(){
    var btn = $('go'), msg = $('msg');
    var v = function(id){ var el = $(id); return el ? el.value.trim() : ''; };

    var payload = {
      action: editToken ? 'updateabstract' : 'submitabstract',
      token: editToken || '',
      title: v('f-title'), category: v('f-cat'), presentation: v('f-pres'),
      sections: (cfg.sections || []).map(function(_, i){ return v('f-s' + i); }),
      email: v('f-email'), phone: v('f-phone'),
      affiliations: affs.map(function(x){ return String(x||'').trim(); })
                        .filter(function(x){ return x; }),
      authors: auths.filter(function(a){ return String(a.name||'').trim(); })
                    .map(function(a){ return { name:a.name.trim(), affs:a.affs||[], presenting:!!a.presenting }; }),
      ethics: v('f-ethics'), conflicts: v('f-conf'),
      website: v('f-web')
    };

    msg.style.color = 'var(--red)';
    if (!payload.title){ msg.textContent = 'Please enter a title.'; return; }
    if (!payload.affiliations.length){ msg.textContent = 'Please add at least one institution.'; return; }
    if (!payload.authors.length){ msg.textContent = 'Please add at least one author.'; return; }
    var noAff = payload.authors.filter(function(a){ return !(a.affs||[]).length; });
    if (noAff.length){ msg.textContent = 'Link ' + noAff[0].name + ' to an institution number.'; return; }
    if (!payload.authors.some(function(a){ return a.presenting; })){
      msg.textContent = 'Please mark which author will present.'; return;
    }
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(payload.email)){ msg.textContent = 'Please enter a valid email address.'; return; }
    if (!payload.category){ msg.textContent = 'Please choose a category.'; return; }
    var total = payload.sections.reduce(function(a,x){ return a + words(x); }, 0);
    if (cfg.wordLimit && total > cfg.wordLimit){
      msg.textContent = 'Your abstract is ' + total + ' words. The limit is ' + cfg.wordLimit + '.'; return;
    }

    btn.disabled = true;
    btn.textContent = editToken ? 'Saving…' : 'Submitting…';
    msg.textContent = '';

    fetch(API_URL, {
      method:'POST',
      headers:{ 'Content-Type':'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    })
    .then(function(r){ return r.json(); })
    .then(function(res){
      if (!res || !res.ok){
        msg.style.color = 'var(--red)';
        msg.textContent = (res && res.error) || 'Something went wrong. Please try again.';
        btn.disabled = false;
        btn.textContent = editToken ? 'Save changes' : 'Submit abstract';
        return;
      }
      if (res.updated){
        msg.style.color = 'var(--go)';
        msg.textContent = 'Saved. Your abstract has been updated.';
        btn.disabled = false;
        btn.textContent = 'Save changes';
        window.scrollTo(0,0);
        return;
      }
      success(res, payload);
    })
    .catch(function(){
      msg.style.color = 'var(--red)';
      msg.textContent = 'Could not reach the server. Check your connection and try again.';
      btn.disabled = false;
      btn.textContent = editToken ? 'Save changes' : 'Submit abstract';
    });
  }

  function success(res, p){
    root.innerHTML =
      '<div class="state done">' +
        '<div class="tick">\u2713</div>' +
        '<h1>Abstract received</h1>' +
        '<p>Thank you. A confirmation has been emailed to you.</p>' +
        '<div class="refbox">' +
          '<div class="lbl">Your abstract number</div>' +
          '<div class="ref mono">' + esc(res.absid) + '</div>' +
          '<div style="font-size:.9rem">' + esc(res.words) + ' words</div>' +
        '</div>' +
        (res.editLink ?
          '<div class="editbox"><h3>To edit before the deadline</h3>' +
          '<a href="' + esc(res.editLink) + '">' + esc(res.editLink) + '</a>' +
          '<p style="font-size:.82rem;color:var(--mist);margin-top:8px">' +
          'This link is also in your email. Keep it \u2014 it is the only way back to your submission.</p></div>' : '') +
        '<p style="color:var(--slate);font-size:.92rem">You will be notified of the outcome after review.</p>' +
        ((cfg.links && cfg.links.register) ?
          '<div class="crosscta"><h3>Now register for the conference</h3>' +
          '<p>Submitting an abstract is separate from registering. Presenting authors must be registered delegates.</p>' +
          '<a href="' + esc(cfg.links.register) + '">Register now</a></div>' : '') +
        '<p class="foot">Powered by <a href="https://confhub.ng">ConfHub.ng</a></p>' +
      '</div>';
    window.scrollTo(0,0);
  }
})();
</script>
</body>
</html>
