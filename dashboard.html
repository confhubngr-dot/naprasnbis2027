<style>
:root{
  --ink:#0B1524; --slate:#4A5B72; --mist:#8A9AAF; --line:#E2E8F0;
  --bg:#F5F8FC; --card:#FFFFFF;
  --brand:#2B46D4; --brand-dark:#1E2F9E; --brand-soft:#EEF1FE; --sky:#0E9DE5;
  --grad:linear-gradient(130deg,#2B46D4,#0E9DE5);
  --go:#10B981; --amber:#F59E0B; --red:#DC2626;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
     background:var(--bg);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased;
     padding:18px 14px 60px}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.wrap{max-width:1000px;margin:0 auto}
button{font-family:inherit;cursor:pointer}

.logos{display:flex;gap:12px;justify-content:center;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.logos img{height:50px;width:auto;max-width:110px;object-fit:contain;background:#fff;border-radius:10px;padding:6px}

.head{background:var(--grad);color:#fff;border-radius:18px;padding:22px 24px;margin-bottom:16px}
.head .kick{font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;opacity:.85;font-weight:700}
.head h1{font-size:1.28rem;font-weight:800;letter-spacing:-.025em;margin:7px 0 5px;line-height:1.25}
.head .meta{font-size:.85rem;opacity:.92}
.head .who{margin-top:9px;font-size:.84rem;opacity:.95}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:11px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.kpi .lbl{font-size:.68rem;letter-spacing:.11em;text-transform:uppercase;color:var(--mist);font-weight:800}
.kpi .val{font-size:1.75rem;font-weight:800;letter-spacing:-.03em;margin-top:5px;line-height:1.1}
.kpi .sub{font-size:.78rem;color:var(--slate);margin-top:3px}
.kpi.go .val{color:var(--go)} .kpi.amber .val{color:var(--amber)} .kpi.brand .val{color:var(--brand)}

.tabs{display:flex;gap:7px;margin-bottom:14px;overflow-x:auto;padding-bottom:3px}
.tabs button{padding:9px 16px;border-radius:999px;border:1.5px solid var(--line);background:#fff;
             font-weight:700;font-size:.86rem;color:var(--slate);white-space:nowrap}
.tabs button.on{background:var(--brand);border-color:var(--brand);color:#fff}

.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 22px;margin-bottom:14px}
.panel h2{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mist);
          font-weight:800;margin-bottom:14px}
.row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:.9rem}
.row:last-child{border-bottom:none}
.row span:first-child{color:var(--slate)}
.row b{font-family:"IBM Plex Mono",monospace;font-weight:600}

.bar{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:.87rem}
.bar .nm{flex:0 0 40%;color:var(--slate);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .tr{flex:1;height:8px;background:var(--line);border-radius:999px;overflow:hidden}
.bar .tr i{display:block;height:100%;background:var(--brand);border-radius:999px}
.bar .vv{flex:0 0 46px;text-align:right;font-family:"IBM Plex Mono",monospace;font-weight:600}

.search{width:100%;padding:11px 14px;border:1.5px solid var(--line);border-radius:11px;
        font:inherit;font-size:.94rem;margin-bottom:12px}
.search:focus{outline:none;border-color:var(--brand)}
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:.86rem}
th{text-align:left;font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--mist);
   font-weight:800;padding:8px 10px;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:none}
.pill{display:inline-block;font-size:.68rem;font-weight:800;padding:3px 8px;border-radius:999px;white-space:nowrap}
.pill.yes{background:rgba(16,185,129,.14);color:#07714E}
.pill.no{background:rgba(245,158,11,.16);color:#8A5A08}
.pill.acc{background:rgba(16,185,129,.14);color:#07714E}
.pill.rej{background:rgba(220,38,38,.1);color:#A81F1F}
.pill.wait{background:#F1F5F9;color:var(--mist)}
.pill.split{background:rgba(245,158,11,.16);color:#8A5A08}
.muted{color:var(--mist)}
.num{text-align:right}
.xtra{font-size:.74rem;color:var(--brand)}
.pill.early{background:rgba(43,70,212,.12);color:var(--brand-dark)}
.pill.std{background:#F1F5F9;color:var(--slate)}
.count{font-size:.8rem;color:var(--mist);margin-bottom:10px}

.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.actions button{padding:10px 16px;border-radius:11px;border:1.5px solid var(--line);
                background:#fff;font-weight:700;font-size:.85rem;color:var(--ink)}
.actions button:hover{border-color:var(--brand);color:var(--brand)}
.refresh{background:var(--grad);color:#fff;border:none;padding:10px 18px;border-radius:11px;
         font-weight:700;font-size:.85rem}

.state{background:var(--card);border-radius:20px;padding:44px 28px;text-align:center;
       box-shadow:0 18px 44px -18px rgba(11,21,36,.28)}
.state h1{font-size:1.2rem;margin-bottom:10px}
.state p{color:var(--slate);font-size:.94rem}
.diag{margin-top:20px;padding:14px 16px;background:#FEF6E7;border:1px solid #F5D9A8;
      border-radius:12px;font-size:.82rem;color:#7A4E06;text-align:left;line-height:1.5}
.foot{text-align:center;margin-top:20px;font-size:.78rem;color:var(--mist)}
.foot a{color:var(--brand);text-decoration:none;font-weight:600}
.stamp{text-align:center;font-size:.76rem;color:var(--mist);margin-top:12px}
.hide{display:none}
@media(max-width:560px){.kpi .val{font-size:1.45rem}}
</style>

<script>

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

            'Deploy \u2192 Manage deployments \u2192 pencil \u2192 Who has access: Anyone \u2192 Deploy.' };
          var d; try { d = JSON.parse(t); } catch(e){ throw { detail:'Server did not return valid data.' }; }

  function barList(obj, title){
    var keys = Object.keys(obj||{});
    if (!keys.length) return '';
    var max = Math.max.apply(null, keys.map(function(k){ return obj[k]; }));
    keys.sort(function(a,b){ return obj[b]-obj[a]; });
    return '<div class="panel"><h2>' + esc(title) + '</h2>' + keys.map(function(k){
      return '<div class="bar"><span class="nm">' + esc(k) + '</span>' +
        '<span class="tr"><i style="width:' + Math.round(obj[k]/max*100) + '%"></i></span>' +
        '<span class="vv">' + obj[k] + '</span></div>';
    }).join('') + '</div>';
  }

  /* ── Badges: 2 x 4 on A4, each with a scannable QR ── */
  function qrSvg(text, px){
    try{
      var q = qrcode(0, 'M');
      q.addData(text);
      q.make();
      var n = q.getModuleCount(), cell = px / n, out = '';
      for (var r=0;r<n;r++) for (var c=0;c<n;c++)
        if (q.isDark(r,c))
          out += '<rect x="' + (c*cell).toFixed(2) + '" y="' + (r*cell).toFixed(2) +
                 '" width="' + cell.toFixed(2) + '" height="' + cell.toFixed(2) + '"/>';
      return '<svg viewBox="0 0 ' + px + ' ' + px + '" width="' + px + '" height="' + px +
             '" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">' +
             '<rect width="' + px + '" height="' + px + '" fill="#fff"/>' +
             '<g fill="#000">' + out + '</g></svg>';
    } catch(e){ return ''; }
  }

  function printBadges(rows){
    if (!rows.length){ alert('No delegates to print badges for.'); return; }
    var B = D.badge || {};
    var mode = String(B.target||'both').toLowerCase();
    // "both" and "app" need an event app address; fall back if it is not set
    if ((mode === 'both' || mode === 'app') && !B.appUrl) mode = 'id';
    var missing = 0;

    // Styled to match the delegate pass: gradient header, dark name, brand chip
    var brand = (D.brand && /^#[0-9a-fA-F]{6}$/.test(D.brand)) ? D.brand : '#2B46D4';
    var cr=parseInt(brand.substr(1,2),16), cg=parseInt(brand.substr(3,2),16), cb=parseInt(brand.substr(5,2),16);
    var li=function(v){ return Math.min(255, Math.round(v+(255-v)*0.35)); };
    var brand2='#'+[li(cr),li(cg),li(cb)].map(function(v){ return ('0'+v.toString(16)).slice(-2); }).join('');
    var soft='rgba('+cr+','+cg+','+cb+',0.10)';

    var css =
      '@page{size:A4;margin:6mm}' +
      'body{padding:0;font-family:"Plus Jakarta Sans",-apple-system,"Segoe UI",Roboto,Arial,sans-serif}' +
      '.sheet{display:grid;grid-template-columns:1fr 1fr;gap:2mm}' +
      '.badge{width:97mm;height:66mm;border-radius:4mm;overflow:hidden;background:#fff;' +
        'display:flex;flex-direction:column;page-break-inside:avoid;border:.4pt solid #d8e0e8;' +
        '-webkit-print-color-adjust:exact;print-color-adjust:exact}' +
      '.b-hd{background:linear-gradient(130deg,' + brand + ',' + brand2 + ');color:#fff;' +
        'padding:3.4mm 5mm 3mm;-webkit-print-color-adjust:exact;print-color-adjust:exact}' +
      '.b-ev{font-size:8pt;font-weight:800;line-height:1.2;letter-spacing:-.01em}' +

      '.b-txt{flex:1;min-width:0}' +
      '.b-lbl{font-size:5.8pt;letter-spacing:.16em;text-transform:uppercase;color:#8A9AAF;font-weight:800}' +
      '.b-name{font-size:16pt;font-weight:800;line-height:1.1;letter-spacing:-.035em;color:#0B1524;' +
        'word-wrap:break-word;margin:1mm 0 .8mm}' +
      '.b-name.long{font-size:13pt}' +
      '.b-inst{font-size:8pt;color:#4A5B72;line-height:1.3}' +
      '.b-cat{display:inline-block;margin-top:2mm;font-size:6.5pt;font-weight:800;' +
        'text-transform:uppercase;letter-spacing:.08em;background:' + soft + ';color:' + brand + ';' +
        'padding:1.1mm 3mm;border-radius:99mm;-webkit-print-color-adjust:exact;print-color-adjust:exact}' +
      '.b-qr{flex:0 0 25mm;text-align:center}' +
      '.b-qr svg{width:25mm;height:25mm;display:block;border:.4pt solid #e2e8f0;border-radius:2mm;padding:1mm}' +
      '.b-id{font-family:"IBM Plex Mono",monospace;font-size:5.6pt;letter-spacing:.09em;color:#8A9AAF;margin-top:.8mm}' +
      '.b-foot{font-size:6pt;color:#8A9AAF;text-align:center;padding:0 5mm 2.6mm}' +
      '.ph{display:none}' +
      '@media screen{.sheet{max-width:204mm;margin:0 auto}}';

    var body = '<div class="sheet">' + rows.map(function(d){
      // "both": the app address with the delegate ID after the #. A phone
      // camera opens the app and ignores the fragment; the scanner reads the ID.
      var target = mode === 'both' ? (B.appUrl.replace(/#.*$/,'').replace(/\/+$/,'') + '/#' + d.id)
                 : mode === 'app'  ? B.appUrl
                 : mode === 'pass' ? d.pass
                 : d.id;
      if (!target || !d.id) missing++;
      var longName = String(d.name||'').length > 26;
      var foot = [];
      // The app address is only printed when the QR does NOT already carry it.
      if (B.appUrl && (mode === 'id' || mode === 'pass'))
        foot.push(B.appUrl.replace(/^https?:\/\//,'').replace(/\/+$/,''));
      if (B.footer) foot.push(B.footer);
      return '<div class="badge">' +
        '<div class="b-hd">' +
          '<div class="b-ev">' + esc(D.event) + '</div>' +
          (D.dates ? '<div class="b-dt">' + esc(D.dates) +
            (D.venue ? ' \u00b7 ' + esc(D.venue) : '') + '</div>' : '') +
        '</div>' +
        '<div class="b-body">' +
          '<div class="b-txt">' +
            '<div class="b-lbl">Delegate</div>' +
            '<div class="b-name' + (longName ? ' long' : '') + '">' + esc(d.name) + '</div>' +
            '<div class="b-inst">' + esc(d.inst) + '</div>' +
            (d.cat ? '<span class="b-cat">' + esc(d.cat) + '</span>' : '') +
          '</div>' +
          '<div class="b-qr">' + (target ? qrSvg(target, 320) : '') +
            '<div class="b-id">' + esc(d.id || '') + '</div>' +
          '</div>' +
        '</div>' +
        (foot.length ? '<div class="b-foot">' + esc(foot.join('  \u00b7  ')) + '</div>' : '') +
      '</div>';
    }).join('') + '</div>';

    if (missing) alert(missing + ' delegate(s) have no code yet, so their badge has no QR. ' +
                       'Run ConfHub \u2192 Generate missing IDs in the spreadsheet.');
    openPrint('Delegate badges', css, body);
  }


  /* ── Book of Abstracts: accepted only, in programme order ── */
  function sessionRank(v){
    var R = ['','I','II','III','IV','V','VI','VII','VIII','IX','X',
             'XI','XII','XIII','XIV','XV','XVI','XVII','XVIII','XIX','XX'];
    var i = R.indexOf(String(v||'').trim().toUpperCase());
    return i > 0 ? i : 900;             // named sessions (posters) sort last
  }
  function sessionHeading(key){
    var label = D.sessionLabel || 'Scientific Session';
    var k = String(key||'').trim();
    if (!k) return 'Unassigned';
    return sessionRank(k) < 900 ? label + ' ' + k : k;
  }

  function printBook(){
    var acc = (D.abstracts || []).filter(function(a){ return a.decision === 'Accepted'; });
    if (!acc.length){
      alert('No accepted abstracts yet. Run ConfHub \u2192 Update decisions in the spreadsheet first.');
      return;
    }
    var unassigned = acc.filter(function(a){ return !String(a.session||'').trim(); }).length;
    if (unassigned && !confirm(unassigned + ' accepted abstract(s) have no session yet and will be grouped ' +
        'at the end.\n\nCarry on and print the book?')) return;

    acc.sort(function(a,b){
      var ra = sessionRank(a.session), rb = sessionRank(b.session);
      if (ra !== rb) return ra - rb;
      if (ra === 900 && a.session !== b.session) return a.session < b.session ? -1 : 1;
      return (a.order||999) - (b.order||999);
    });

    var groups = [], seen = {};
    acc.forEach(function(a){
      var k = String(a.session||'').trim() || 'Unassigned';
      if (!seen[k]){ seen[k] = []; groups.push(k); }
      seen[k].push(a);
    });

    var fmtText = function(t){
      return String(t||'').split(/\n\s*\n/).map(function(block){
        var lines = block.split('\n');
        if (lines.length > 1 && lines[0] === lines[0].toUpperCase() && lines[0].trim().length < 60)
          return '<p><b>' + esc(lines[0].trim()) + '</b><br>' + esc(lines.slice(1).join('\n')) + '</p>';
        return '<p>' + esc(block) + '</p>';
      }).join('');
    };

    var toc = groups.map(function(k){
      return '<div class="tocsec"><h3>' + esc(sessionHeading(k)) + '</h3><ol>' +
        seen[k].map(function(a){
          return '<li><span class="pn">' + esc(a.no || a.id) + '</span>' + esc(a.title) + '</li>';
        }).join('') + '</ol></div>';
    }).join('');

    var bodyHtml = groups.map(function(k){
      return '<section><h1 class="sess">' + esc(sessionHeading(k)) + '</h1>' +
        seen[k].map(function(a){
          return '<article>' +
            '<div class="pnum">' + esc(a.no || a.id) + '</div>' +
            '<h2>' + esc(a.title) + '</h2>' +
            '<p class="auth">' + esc(a.authors || a.author) + '</p>' +
            (a.affs ? '<p class="affs">' + esc(a.affs).replace(/\n/g,'<br>') + '</p>' : '') +
            fmtText(a.text) +
          '</article>';
        }).join('') + '</section>';
    }).join('');

    var css =
      '@page{size:A4;margin:18mm 16mm}' +
      'body{font-family:Georgia,"Times New Roman",serif;padding:0}' +
      '.cover{text-align:center;padding:60px 0 40px;page-break-after:always}' +
      '.cover .lg{display:flex;gap:18px;justify-content:center;margin-bottom:26px}' +
      '.cover .lg img{height:78px;width:auto;object-fit:contain}' +
      '.cover h1{font-size:24pt;line-height:1.25;margin-bottom:10px}' +
      '.cover p{font-size:11.5pt;color:#444;margin:3px 0}' +
      '.cover .bk{font-size:14pt;margin-top:34px;letter-spacing:.22em;text-transform:uppercase;color:#666}' +
      '.cover .ch{margin-top:60px;font-size:8.5pt;color:#888;letter-spacing:.06em}' +
      '.toc{page-break-after:always}' +
      '.toc h2{font-size:15pt;border-bottom:2px solid #333;padding-bottom:6px;margin-bottom:6px}' +
      '.tocsec h3{font-size:10.5pt;margin:16px 0 5px;color:#333}' +
      '.tocsec ol{list-style:none;padding-left:0;font-size:9.5pt}' +
      '.tocsec li{margin-bottom:3px;color:#333;line-height:1.35}' +
      '.pn{display:inline-block;min-width:56px;font-family:"Courier New",monospace;color:#666}' +
      'section{page-break-before:always}' +
      'h1.sess{font-size:15pt;border-bottom:2px solid #333;padding-bottom:6px;margin-bottom:16px}' +
      'article{page-break-inside:avoid;margin-bottom:22px;padding-bottom:16px;border-bottom:1px solid #ddd}' +
      '.pnum{font-family:"Courier New",monospace;font-size:9.5pt;color:#666;margin-bottom:3px}' +
      'article h2{font-size:12pt;margin:0 0 5px;line-height:1.3}' +
      '.auth{font-size:10pt;margin:0 0 2px}' +
      '.affs{font-size:8.5pt;color:#555;margin:0 0 9px;font-style:italic;line-height:1.35}' +
      'article p{font-size:9.5pt;margin:0 0 6px;text-align:justify;line-height:1.45}' +
      '.ph{display:none}' +
      '.bfoot{margin-top:40px;padding-top:10px;border-top:1px solid #ccc;text-align:center;' +
        'font-size:8.5pt;color:#777;font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif}';

    var logos = (D.logos && D.logos.length)
      ? '<div class="lg">' + D.logos.map(function(u){ return '<img src="' + esc(u) + '">'; }).join('') + '</div>' : '';

    var full =
      '<div class="cover">' + logos +
        '<h1>' + esc(D.event) + '</h1>' +
        '<p>' + esc(D.dates) + '</p>' +
        (D.venue ? '<p>' + esc(D.venue) + '</p>' : '') +
        '<p class="bk">Book of Abstracts</p>' +
        '<p class="ch">Powered by ConfHub.ng</p>' +
      '</div>' +
      '<div class="toc"><h2>Contents</h2>' + toc +
        '<div class="bfoot">' + acc.length + ' abstracts \u00b7 ' + groups.length +
        ' sessions \u00b7 Powered by ConfHub.ng</div></div>' +
      bodyHtml +
      '<div class="bfoot">Powered by ConfHub.ng</div>';

    openPrint('Book of Abstracts', css, full);
  }

  /* ── CSV export, done in the browser ── */
  function csv(which){
    var rows = [], name = '';
    if (which === 'delegates'){
      name = 'delegates';
      var hdr = ['Name','Institution','Category','Extras','Rate','Paid','Method','Reference','Amount','Days attended'];
      if (has('contacts')) hdr = hdr.slice(0,7).concat(['Email','Phone'], hdr.slice(7));
      rows.push(hdr);
      (D.delegates||[]).forEach(function(d){
        var r = [d.name, d.inst, d.cat, d.extras||'', d.rate||'', d.paid?'Yes':'No', d.method||''];
        if (has('contacts')) r = r.concat([d.email, d.phone]);
        rows.push(r.concat([d.ref, d.amount, d.days]));
      });
    } else {
      name = 'abstracts';
      rows.push(['Number','ID','Title','Category','Presenting author','Institution','Decision','Type']);
      (D.abstracts||[]).forEach(function(a){
        rows.push([a.no, a.id, a.title, a.cat, a.author, a.inst, a.decision, a.type]);
      });
    }
    var out = rows.map(function(r){
      return r.map(function(c){
        c = String(c==null?'':c);
        return /[",\n]/.test(c) ? '"' + c.replace(/"/g,'""') + '"' : c;
      }).join(',');
    }).join('\r\n');

    var blob = new Blob(['\ufeff' + out], { type:'text/csv;charset=utf-8;' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = (D.event || 'conference').replace(/[^A-Za-z0-9]+/g,'-').toLowerCase() + '-' + name + '.csv';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
  }
})();
</script>
