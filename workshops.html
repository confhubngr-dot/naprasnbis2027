const API_URL = "https://script.google.com/macros/s/AKfycbzuXOOzdEVNdM9Lj5G18eFXFK0RU9yklZSFZ_rYFyGg_FEE8VaU0mu2B3cEbdqnjLZm/exec";

<style>
:root{
  --ink:#0B1524; --slate:#4A5B72; --mist:#8A9AAF; --line:#E2E8F0;
  --bg:#F5F8FC; --card:#FFFFFF;
  --brand:#2B46D4; --brand-dark:#1E2F9E; --brand-soft:#EEF1FE; --sky:#0E9DE5;
  --grad:linear-gradient(130deg,#2B46D4,#0E9DE5);
  --go:#10B981; --amber:#F59E0B; --red:#DC2626;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
     background:var(--bg);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased;
     padding:20px 16px 60px}
body.shelled{padding:0}
body.shelled .wrap{max-width:none}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto}
.bare{max-width:560px;margin:0 auto}

.eb{display:flex;gap:10px;align-items:flex-start;background:#FEF6E7;border:1px solid #F5D9A8;
    border-radius:12px;padding:12px 14px;margin-bottom:22px;font-size:.88rem;color:#8A5A08}
.eb b{color:#6B4405}

h2{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mist);
   font-weight:800;margin:26px 0 12px}
h2:first-of-type{margin-top:0}

.field{margin-bottom:15px}
label{display:block;font-size:.85rem;font-weight:700;margin-bottom:6px}
label .opt{font-weight:500;color:var(--mist)}
input[type=text],input[type=email],input[type=tel],select{
  width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:11px;
  font:inherit;font-size:.96rem;background:#fff;color:var(--ink)}
input:focus,select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(43,70,212,.11)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:520px){.two{grid-template-columns:1fr}}
.hp{position:absolute;left:-9999px}

/* category options */
.opts{display:flex;flex-direction:column;gap:9px}
.opt-row{display:flex;align-items:center;gap:12px;padding:13px 15px;border:1.5px solid var(--line);
         border-radius:12px;cursor:pointer;background:#fff;transition:border-color .15s,background .15s}
.opt-row:hover{border-color:#C9D3F6}
.opt-row.sel{border-color:var(--brand);background:var(--brand-soft)}
.opt-row input{accent-color:var(--brand);width:18px;height:18px;flex:0 0 18px}
.opt-row .txt{flex:1;min-width:0}
.opt-row .nm{font-weight:700;font-size:.94rem;display:block}
.opt-row .nt{font-size:.8rem;color:var(--mist);display:block;line-height:1.35}
.opt-row .pr{font-weight:800;font-size:.98rem;white-space:nowrap;text-align:right}
.opt-row .was{display:block;font-size:.76rem;font-weight:500;color:var(--mist);text-decoration:line-through}

/* total */
.total{margin-top:24px;border:2px solid var(--brand);border-radius:14px;overflow:hidden}
.total .line{display:flex;justify-content:space-between;padding:10px 16px;font-size:.9rem;color:var(--slate);
             border-bottom:1px dashed var(--line)}
.total .grand{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;
              background:var(--brand-soft)}
.total .grand span{font-weight:700}
.total .grand b{font-size:1.4rem;font-weight:800;letter-spacing:-.02em;color:var(--brand-dark)}

.btn{width:100%;margin-top:20px;padding:16px;border:none;border-radius:13px;background:var(--grad);
     color:#fff;font-family:inherit;font-weight:700;font-size:1rem;cursor:pointer;
     box-shadow:0 6px 18px rgba(43,70,212,.3)}
.btn:hover{filter:brightness(1.07)}
.btn:disabled{opacity:.6;cursor:not-allowed;filter:none}
.msg{margin-top:13px;font-size:.9rem;font-weight:600;min-height:1.2em;text-align:center}
.note{margin-top:16px;font-size:.82rem;color:var(--mist);text-align:center}

/* states */
.state{background:var(--card);border-radius:20px;padding:44px 28px;text-align:center;
       box-shadow:0 18px 44px -18px rgba(11,21,36,.28);margin-top:40px}
.state h1{font-size:1.2rem;margin-bottom:10px}
.state p{color:var(--slate);font-size:.94rem}
/* the same message, framed by the shell */
.panel .notice{text-align:center;padding:14px 0 6px}
.panel .notice h1{font-size:1.35rem;font-weight:800;letter-spacing:-.025em;margin-bottom:10px}
.panel .notice p{color:var(--slate);font-size:.95rem;max-width:46ch;margin:0 auto}

/* success */
.done .tick{width:62px;height:62px;border-radius:50%;background:var(--go);color:#fff;
            display:flex;align-items:center;justify-content:center;font-size:2rem;margin:0 auto 18px}
.done h1{font-size:1.45rem;font-weight:800;letter-spacing:-.02em;margin-bottom:8px}
.done .sub{color:var(--slate);font-size:.94rem;margin-bottom:24px}
.refbox{background:var(--brand-soft);border:2px dashed var(--brand);border-radius:14px;
        padding:18px;margin-bottom:20px}
.refbox .lbl{font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--brand-dark);font-weight:800}
.refbox .ref{font-size:1.65rem;font-weight:800;letter-spacing:.1em;margin:6px 0 2px;color:var(--brand-dark)}
.refbox .amt{font-size:1.05rem;font-weight:700}
.pay{text-align:left;border:1.5px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
.pay h3{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mist);font-weight:800;margin-bottom:10px}
.pay .row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;font-size:.92rem;
          border-bottom:1px dashed var(--line)}
.pay .row:last-child{border-bottom:none}
.pay .row span:first-child{color:var(--slate)}
.pay .row b{text-align:right;word-break:break-word}
.paybtn{display:block;width:100%;padding:15px;border-radius:13px;background:var(--go);color:#fff;
        font-weight:700;text-decoration:none;text-align:center;margin-bottom:14px}
.warn{background:#FEF6E7;border:1px solid #F5D9A8;border-radius:12px;padding:13px 15px;
      font-size:.87rem;color:#8A5A08;text-align:left;margin-bottom:14px}
.foot{text-align:center;margin-top:22px;font-size:.78rem;color:var(--mist)}
.foot a{color:var(--brand);text-decoration:none;font-weight:600}
.hide{display:none}
.logos{display:flex;gap:14px;justify-content:center;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.logos img{height:64px;width:auto;max-width:130px;object-fit:contain;
           background:#fff;border-radius:12px;padding:7px}
@media(max-width:480px){.logos img{height:52px}}

.linkbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.linkbar a{flex:1 1 auto;min-width:140px;text-align:center;padding:11px 14px;border-radius:11px;
           border:1.5px solid var(--line);background:#fff;color:var(--slate);
           text-decoration:none;font-weight:700;font-size:.86rem}
.linkbar a:hover{border-color:var(--brand);color:var(--brand)}
.linkbar a.primary{background:var(--brand-soft);border-color:#C9D3F6;color:var(--brand-dark)}
.crosscta{margin-top:18px;padding:18px;border:2px solid var(--brand);border-radius:14px;
          background:var(--brand-soft);text-align:left}
.crosscta h3{font-size:.95rem;font-weight:800;color:var(--brand-dark);margin-bottom:6px}
.crosscta p{font-size:.87rem;color:var(--slate);margin-bottom:12px}
.crosscta a{display:block;padding:13px;border-radius:11px;background:var(--grad);color:#fff;
            text-align:center;text-decoration:none;font-weight:700;font-size:.94rem}

.diag{margin-top:20px;padding:14px 16px;background:#FEF6E7;border:1px solid #F5D9A8;
      border-radius:12px;font-size:.82rem;color:#7A4E06;text-align:left;line-height:1.5}
@media print{ body{background:#fff;padding:0} .btn,.paybtn{display:none} }

/* ═══════════════════════════════════════════════════════════════════
   CONGRESS MICROSITE SHELL
   Identical in register.html and abstracts.html. Every piece hides
   itself when its Sheet setting is blank, so a bare-bones event still
   gets a clean page and a fully filled-in one gets the full microsite.
   ═══════════════════════════════════════════════════════════════════ */
.site{min-height:100vh;display:flex;flex-direction:column}

/* ── sticky masthead ── */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50}
.mast{background:rgba(255,255,255,.96);
      backdrop-filter:saturate(1.6) blur(12px);border-bottom:1px solid var(--line)}
.mast .in{max-width:1120px;margin:0 auto;padding:11px 20px;
          display:flex;align-items:center;gap:14px}
.mast .marks{display:flex;align-items:center;gap:9px;flex:0 0 auto}
.mast .marks img{height:38px;width:auto;max-width:74px;object-fit:contain}
.mast .who{min-width:0;flex:1}
.mast .who .nm{font-weight:800;font-size:.93rem;letter-spacing:-.015em;line-height:1.25;
               overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mast .who .dt{font-size:.74rem;color:var(--mist);font-weight:600;
               overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mast .act{flex:0 0 auto;display:flex;gap:8px}
.mast .act a{padding:9px 15px;border-radius:9px;font-size:.82rem;font-weight:700;
             text-decoration:none;white-space:nowrap}
.mast .act a.ghost{color:var(--slate);border:1.5px solid var(--line);background:#fff}
.mast .act a.ghost:hover{border-color:var(--brand);color:var(--brand)}
.mast .act a.solid{background:var(--grad);color:#fff;box-shadow:0 4px 12px rgba(11,21,36,.16)}
@media(max-width:860px){
  .mast .act a.ghost{display:none}
  .mast .in{padding:10px 16px;gap:11px}
  .mast .marks img{height:32px;max-width:60px}
}

/* ── sub-navigation: the spine of the microsite ── */
.subnav{background:var(--ink)}
.subnav .in{max-width:1120px;margin:0 auto;display:flex;gap:2px;overflow-x:auto;
            padding:0 20px;scrollbar-width:none;-ms-overflow-style:none}
.subnav .in::-webkit-scrollbar{display:none}
.subnav a{padding:13px 16px;font-size:.84rem;font-weight:700;color:rgba(255,255,255,.66);
          text-decoration:none;white-space:nowrap;border-bottom:3px solid transparent}
.subnav a:hover{color:#fff}
.subnav a.on{color:#fff;border-bottom-color:var(--brand)}
.subnav a .shut{font-size:.68rem;font-weight:700;opacity:.6;margin-left:5px}
@media(max-width:860px){.subnav .in{padding:0 16px}.subnav a{padding:12px 13px;font-size:.8rem}}

/* ── hero ── */
.hero{position:relative;background:var(--grad);color:#fff;overflow:hidden;isolation:isolate}
.hero .shot{position:absolute;inset:0;background-size:cover;background-position:center;
            z-index:-2}
.hero .veil{position:absolute;inset:0;z-index:-1}
.hero .in{max-width:1120px;margin:0 auto;padding:54px 20px 48px;position:relative}
.hero .kick{display:inline-flex;align-items:center;gap:7px;font-size:.72rem;font-weight:800;
            letter-spacing:.14em;text-transform:uppercase;background:rgba(255,255,255,.17);
            border:1px solid rgba(255,255,255,.26);padding:6px 13px;border-radius:999px;
            margin-bottom:18px}
.hero h1{font-size:clamp(1.65rem,4.4vw,2.85rem);font-weight:800;letter-spacing:-.03em;
         line-height:1.08;max-width:19ch;text-wrap:balance}
.hero .tag{margin-top:14px;font-size:clamp(.96rem,1.6vw,1.12rem);font-weight:600;
           opacity:.93;max-width:44ch;line-height:1.45}
.hero .facts{margin-top:22px;display:flex;flex-wrap:wrap;gap:8px 22px;font-size:.92rem;
             font-weight:600;opacity:.95}
.hero .facts span{display:inline-flex;align-items:center;gap:7px}
.hero .ctas{margin-top:30px;display:flex;flex-wrap:wrap;gap:11px}
.hero .ctas a{padding:14px 24px;border-radius:12px;font-weight:700;font-size:.95rem;
              text-decoration:none}
.hero .ctas a.go{background:#fff;color:var(--brand-dark);box-shadow:0 8px 22px rgba(11,21,36,.22)}
.hero .ctas a.go:hover{transform:translateY(-1px)}
.hero .ctas a.alt{background:rgba(255,255,255,.14);color:#fff;
                  border:1.5px solid rgba(255,255,255,.4)}
.hero .ctas a.alt:hover{background:rgba(255,255,255,.22)}
@media(max-width:620px){.hero .in{padding:38px 16px 34px}.hero .ctas a{flex:1 1 100%;text-align:center}}

/* ── at a glance ── */
.glance{background:#fff;border-bottom:1px solid var(--line)}
.glance .in{max-width:1120px;margin:0 auto;padding:0 20px;
            display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.glance .cell{padding:20px 22px 20px 0;border-left:1px solid var(--line);
              padding-left:22px}
.glance .cell:first-child{border-left:none;padding-left:0}
.glance .k{font-size:.68rem;font-weight:800;letter-spacing:.13em;text-transform:uppercase;
           color:var(--mist);margin-bottom:5px}
.glance .v{font-weight:700;font-size:.97rem;letter-spacing:-.01em;line-height:1.35}
@media(max-width:700px){
  .glance .in{grid-template-columns:1fr 1fr;padding:0 16px}
  .glance .cell{padding:15px 14px 15px 14px;border-left:1px solid var(--line);
                border-top:1px solid var(--line)}
  .glance .cell:nth-child(1),.glance .cell:nth-child(2){border-top:none}
  .glance .cell:nth-child(odd){border-left:none;padding-left:0}
}

/* ── body: form + sidebar ── */
.main{flex:1;max-width:1120px;margin:0 auto;width:100%;padding:34px 20px 56px;
      display:grid;grid-template-columns:minmax(0,1fr) 322px;gap:26px;align-items:start}
/* a thinly configured event has no sidebar, so centre the form */
.main.solo{grid-template-columns:minmax(0,760px);justify-content:center}
@media(max-width:940px){.main{grid-template-columns:1fr;padding:24px 16px 48px}}

.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;
        padding:30px 30px 34px;box-shadow:0 14px 40px -24px rgba(11,21,36,.3)}
.panel > .ptitle{font-size:1.32rem;font-weight:800;letter-spacing:-.025em;margin-bottom:7px}
.panel > .pintro{color:var(--slate);font-size:.94rem;margin-bottom:24px;max-width:58ch}
.panel > .pintro:last-child{margin-bottom:0}
@media(max-width:620px){.panel{padding:22px 19px 26px;border-radius:15px}}

/* sidebar */
.side{display:flex;flex-direction:column;gap:14px;position:sticky;
      top:calc(112px + env(safe-area-inset-top,0px))}
@media(max-width:940px){.side{position:static;top:auto}}
.box{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:19px 20px}
.box h3{font-size:.69rem;font-weight:800;letter-spacing:.13em;text-transform:uppercase;
        color:var(--mist);margin-bottom:13px}
.box.accent{background:var(--brand-soft);border-color:transparent;
            box-shadow:inset 0 0 0 1.5px var(--brand)}
.box.accent h3{color:var(--brand-dark)}

.dates{display:flex;flex-direction:column;gap:11px}
.dates .d{display:flex;justify-content:space-between;align-items:baseline;gap:12px;
          padding-bottom:11px;border-bottom:1px dashed var(--line)}
.dates .d:last-child{padding-bottom:0;border-bottom:none}
.dates .d .l{font-size:.85rem;color:var(--slate);font-weight:600;min-width:0}
.dates .d .r{font-weight:700;font-size:.85rem;text-align:right;white-space:nowrap}
.dates .d.next .l{color:var(--ink)}
.dates .d.next .r{color:var(--brand-dark)}
.dates .d .cd{display:block;font-size:.72rem;font-weight:800;color:var(--brand);
              letter-spacing:.02em}
.dates .d.gone{opacity:.5}
.dates .d.gone .r{text-decoration:line-through}

.inc{list-style:none;display:flex;flex-direction:column;gap:9px}
.inc li{display:flex;gap:9px;font-size:.87rem;color:var(--slate);line-height:1.45}
.inc li::before{content:"\2713";color:var(--go);font-weight:800;flex:0 0 auto}

.reach{display:flex;flex-direction:column;gap:8px}
.reach a,.reach .ln{display:flex;align-items:center;gap:9px;font-size:.87rem;
                    color:var(--slate);text-decoration:none;font-weight:600;word-break:break-word}
.reach a:hover{color:var(--brand)}
.reach .ico{flex:0 0 auto;width:17px;text-align:center;opacity:.65}

/* ── footer ── */
.sitefoot{background:var(--ink);color:rgba(255,255,255,.62);margin-top:auto}
.sitefoot .in{max-width:1120px;margin:0 auto;padding:30px 20px 34px;
              display:flex;flex-wrap:wrap;gap:18px 34px;align-items:center;
              justify-content:space-between;font-size:.83rem}
.sitefoot b{color:#fff;font-weight:700;display:block;margin-bottom:3px}
.sitefoot nav{display:flex;flex-wrap:wrap;gap:8px 20px}
.sitefoot a{color:rgba(255,255,255,.72);text-decoration:none;font-weight:600}
.sitefoot a:hover{color:#fff}
.sitefoot .brandline{width:100%;border-top:1px solid rgba(255,255,255,.14);
                     padding-top:16px;font-size:.78rem}
.sitefoot .brandline a{color:#fff}

/* ── floating WhatsApp ── */
.wa{position:fixed;right:17px;bottom:calc(17px + env(safe-area-inset-bottom,0px));z-index:60;width:53px;height:53px;border-radius:50%;
    background:#25D366;display:flex;align-items:center;justify-content:center;
    box-shadow:0 8px 22px rgba(0,0,0,.26);text-decoration:none}
.wa:hover{transform:scale(1.06)}
.wa svg{width:27px;height:27px;fill:#fff}
@media print{.wa,.mast,.subnav,.sitefoot,.hero .ctas{display:none}}


/* ── workshop cards ─────────────────────────────────────────────── */
.wsgrid{display:flex;flex-direction:column;gap:22px}
.ws{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff}
.ws.full{opacity:.72}
.ws .pic{width:100%;aspect-ratio:21/8;object-fit:cover;display:block;background:var(--brand-soft)}
.ws .in{padding:22px 24px 24px}
@media(max-width:620px){.ws .in{padding:17px 16px 19px}}
.ws .tophead{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;
             margin-bottom:4px}
.ws h3{font-size:1.14rem;font-weight:800;letter-spacing:-.02em;line-height:1.28;
       text-wrap:balance;min-width:0}
.ws .tag{font-size:.9rem;color:var(--slate);margin-top:5px}
.ws .chip{flex:0 0 auto;font-size:.68rem;font-weight:800;letter-spacing:.09em;
          text-transform:uppercase;padding:5px 11px;border-radius:999px;white-space:nowrap}
.ws .chip.open{background:#E7F7F0;color:#06704C}
.ws .chip.few{background:#FEF3E2;color:#8A5A08}
.ws .chip.full{background:#FBE9E9;color:#9A1C1C}
.ws .chip.closed{background:#EEF1F5;color:#5A6B81}

.ws .facts{display:flex;flex-wrap:wrap;gap:7px 18px;margin:15px 0 0;
           padding:13px 0 0;border-top:1px solid var(--line);
           font-size:.87rem;color:var(--slate);font-weight:600}
.ws .facts span{display:inline-flex;align-items:center;gap:7px}
.ws .facts b{color:var(--ink);font-weight:700}

.ws .body{margin-top:14px;font-size:.93rem;color:var(--slate);line-height:1.6;max-width:62ch}
.ws h4{font-size:.69rem;font-weight:800;letter-spacing:.13em;text-transform:uppercase;
       color:var(--mist);margin:18px 0 9px}
.ws .learn{list-style:none;display:flex;flex-direction:column;gap:8px}
.ws .learn li{display:flex;gap:10px;font-size:.9rem;color:var(--slate);line-height:1.5}
.ws .learn li::before{content:"\2192";color:var(--brand);font-weight:800;flex:0 0 auto}
.ws .fac{display:flex;flex-direction:column;gap:9px}
.ws .fac .p{display:flex;gap:11px;align-items:flex-start;font-size:.9rem}
.ws .fac .av{flex:0 0 auto;width:30px;height:30px;border-radius:50%;background:var(--brand-soft);
             color:var(--brand-dark);display:flex;align-items:center;justify-content:center;
             font-weight:800;font-size:.76rem}
.ws .fac .nm{font-weight:700;display:block}
.ws .fac .rl{color:var(--mist);font-size:.84rem;line-height:1.4;display:block}

.ws .foot{margin-top:20px;padding-top:17px;border-top:1px solid var(--line);
          display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.ws .price{font-size:1.3rem;font-weight:800;letter-spacing:-.02em}
.ws .price small{display:block;font-size:.74rem;font-weight:600;color:var(--mist);
                 letter-spacing:0;margin-top:1px}
.ws .foot a{padding:12px 22px;border-radius:11px;background:var(--grad);color:#fff;
            text-decoration:none;font-weight:700;font-size:.9rem;white-space:nowrap}
.ws .foot a:hover{filter:brightness(1.07)}
.ws .foot .shut{padding:12px 20px;border-radius:11px;background:#EEF1F5;color:#5A6B81;
                font-weight:700;font-size:.88rem}
@media(max-width:520px){.ws .foot a,.ws .foot .shut{flex:1 1 100%;text-align:center}}

.howto{margin-top:26px;background:var(--brand-soft);border-radius:14px;padding:20px 22px;
       box-shadow:inset 0 0 0 1.5px var(--brand)}
.howto h3{font-size:.95rem;font-weight:800;color:var(--brand-dark);margin-bottom:9px}
.howto ol{margin:0;padding-left:19px;color:var(--slate);font-size:.9rem;line-height:1.65}
.howto ol li{margin-bottom:4px}


/* ── workshops run full width: a narrow column beside a short sidebar
      leaves a dead band down the right of a desktop screen ───────── */
.main.wide{grid-template-columns:minmax(0,1fr)}
.wsgrid{display:grid;grid-template-columns:1fr;gap:22px}
@media(min-width:1000px){ .wsgrid{grid-template-columns:1fr 1fr;gap:24px} }
.ws{display:flex;flex-direction:column}
.ws .in{display:flex;flex-direction:column;flex:1}
.ws .foot{margin-top:auto}
.ws .pic{display:block;width:100%;aspect-ratio:21/8;background:var(--brand-soft);overflow:hidden}
.ws .pic img{width:100%;height:100%;object-fit:cover;display:block}
.ws .chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;flex:0 0 auto}
.ws .chip.alone{background:#EEF2FF;color:#3730A3}
.ws .fac .av.ph{object-fit:cover;background:var(--brand-soft)}
/* the facts strip under the title, side by side on a wide card */
.wsbar{display:flex;flex-wrap:wrap;gap:10px 20px;margin-top:22px;padding:16px 20px;
       background:#fff;border:1px solid var(--line);border-radius:14px;
       font-size:.88rem;color:var(--slate);font-weight:600}
.wsbar span{display:inline-flex;align-items:center;gap:8px}
.wsbar b{color:var(--ink)}

/* chips sit above the title: side by side they crushed long titles
   into narrow ribbons in the two-column grid */
.ws .chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-start;margin-bottom:10px}
.ws .chips:empty{display:none}
.ws h3{font-size:1.14rem;font-weight:800;letter-spacing:-.02em;line-height:1.3;
       text-wrap:balance}
.ws .tag{font-size:.9rem;color:var(--slate);margin-top:6px}
</style>
</head>
<body>
<div class="wrap" id="root">
  <div class="state"><h1>Loading workshops…</h1><p>One moment.</p></div>
</div>

<script>
(function(){
  var root = document.getElementById('root');
  var cfg = null;

  function esc(s){
    return String(s==null?'':s).replace(/[&<>"]/g,function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
    });
  }

  function state(html){
    if (!cfg){ root.innerHTML = '<div class="bare"><div class="state">' + html + '</div></div>'; return; }
    page('workshops', { kicker:'Pre-conference workshops',
                        body:'<div class="notice">' + html + '</div>',
                        side:(datesBox() + reachBox()) });
  }

  // Each association can set its own colour in the Sheet
  function applyBrand(hex){
    if (!/^#[0-9a-fA-F]{6}$/.test(String(hex||''))) return;
    var r = parseInt(hex.substr(1,2),16), g = parseInt(hex.substr(3,2),16), b = parseInt(hex.substr(5,2),16);
    var lighten = function(v){ return Math.min(255, Math.round(v + (255-v)*0.35)); };
    var second = '#' + [lighten(r),lighten(g),lighten(b)]
                        .map(function(v){ return ('0'+v.toString(16)).slice(-2); }).join('');
    var rt = document.documentElement;
    rt.style.setProperty('--brand', hex);
    rt.style.setProperty('--sky', second);
    rt.style.setProperty('--grad', 'linear-gradient(130deg,' + hex + ',' + second + ')');
    rt.style.setProperty('--brand-soft', 'rgba(' + r + ',' + g + ',' + b + ',0.08)');
    rt.style.setProperty('--brand-dark', hex);
    var meta = document.querySelector('meta[name=theme-color]');
    if (meta) meta.setAttribute('content', hex);
  }

  /* ═══════════════════════════════════════════════════════════════
     CONGRESS MICROSITE SHELL
     Identical in register.html and abstracts.html. Builds the
     masthead, sub-navigation, hero, at-a-glance strip, sidebar and
     footer from the Sheet. Every piece returns '' when its setting
     is blank, so a thinly configured event still looks intentional.

     page()  wraps the form in the whole shell
     Call it as:  page('register', formHtml, sidebarHtml)
     ═══════════════════════════════════════════════════════════════ */

  function sh(){ return (cfg && cfg.shell) || {}; }

  function marks(){
    var L = (cfg && cfg.links && cfg.links.logos) || [];
    if (!L.length) return '';
    return '<div class="marks">' + L.map(function(u){
      return '<img src="' + esc(u) + '" alt="" loading="lazy">';
    }).join('') + '</div>';
  }

  /* The pages of this event, in the order a delegate meets them.
     'current' is the one we are on. */
  function navItems(current){
    var L = (cfg && cfg.links) || {}, S = sh(), out = [];
    if (L.home)      out.push({ k:'home',      t:'Home',         href:L.home });
    if (L.site)      out.push({ k:'site',      t:'Association',  href:L.site });
    if (L.register)  out.push({ k:'register',  t:'Registration', href:L.register,
                                shut: !L.registrationOpen });
    if (L.abstracts) out.push({ k:'abstracts', t:'Abstracts',    href:L.abstracts,
                                shut: !L.abstractsOpen });
    if (L.workshops && L.workshopsOpen)
                     out.push({ k:'workshops', t:'Workshops',    href:L.workshops });
    if (S.programme) out.push({ k:'programme', t:'Programme',    href:S.programme });
    if (S.venueLink) out.push({ k:'venue',     t:'Venue',        href:S.venueLink });
    if (L.app)       out.push({ k:'app',       t:'Conference app', href:L.app });

    // Two settings can legitimately hold the same address - the event home
    // and the association site, say. Show that destination once.
    var seen = {};
    return out.filter(function(i){
      var key = String(i.href||'').replace(/\/+$/,'').toLowerCase();
      if (!key || seen[key]) return false;
      seen[key] = 1; return true;
    });
  }

  function masthead(current){
    var L = (cfg && cfg.links) || {};
    var act = [];
    // The page you are not on is the one worth offering
    if (current !== 'abstracts' && L.abstracts && L.abstractsOpen)
      act.push('<a class="ghost" href="' + esc(L.abstracts) + '">Submit an abstract</a>');
    if (current !== 'register' && L.register && L.registrationOpen)
      act.push('<a class="solid" href="' + esc(L.register) + '">Register</a>');

    return '<header class="mast"><div class="in">' +
        marks() +
        '<div class="who">' +
          '<div class="nm">' + esc(cfg.event) + '</div>' +
          '<div class="dt">' + esc(cfg.dates || '') +
            (cfg.venue ? ' &middot; ' + esc(cfg.venue) : '') + '</div>' +
        '</div>' +
        (act.length ? '<div class="act">' + act.join('') + '</div>' : '') +
      '</div></header>';
  }

  function subnav(current){
    var items = navItems(current);
    if (items.length < 2) return '';
    return '<nav class="subnav"><div class="in">' + items.map(function(i){
      return '<a href="' + esc(i.href) + '"' + (i.k === current ? ' class="on"' : '') + '>' +
             esc(i.t) + (i.shut ? '<span class="shut">closed</span>' : '') + '</a>';
    }).join('') + '</div></nav>';
  }

  function hero(kicker, headline, ctas){
    var S = sh(), L = (cfg && cfg.links) || {};
    var facts = [];
    if (cfg.dates) facts.push('<span>📅 ' + esc(cfg.dates) + '</span>');
    if (cfg.venue) facts.push('<span>📍 ' + esc(cfg.venue) +
                              (S.city ? ', ' + esc(S.city) : '') + '</span>');
    else if (S.city) facts.push('<span>📍 ' + esc(S.city) + '</span>');

    var live = (ctas || []).filter(function(c){ return c && c.href; });
    var btn = live.map(function(c, i){
      // one button alone always reads as the primary one
      var cls = (live.length === 1 || !c.alt) ? 'go' : 'alt';
      return '<a class="' + cls + '" href="' + esc(c.href) + '">' + esc(c.label) + '</a>';
    });

    // A photo needs darkening or white text on it is unreadable
    var shot = '', veil = '';
    if (S.hero){
      var a = (S.overlay == null ? 55 : S.overlay) / 100;
      shot = '<div class="shot" style="background-image:url(\'' + esc(S.hero) + '\')"></div>';
      veil = '<div class="veil" style="background:linear-gradient(130deg,' +
             'rgba(0,0,0,' + (a + 0.12).toFixed(2) + '),rgba(0,0,0,' + a.toFixed(2) + '))"></div>';
    }

    return '<section class="hero">' + shot + veil + '<div class="in">' +
        (kicker ? '<div class="kick">' + esc(kicker) + '</div>' : '') +
        '<h1>' + esc(headline || cfg.event) + '</h1>' +
        (S.tagline ? '<p class="tag">' + esc(S.tagline) + '</p>' : '') +
        (facts.length ? '<div class="facts">' + facts.join('') + '</div>' : '') +
        (btn.length ? '<div class="ctas">' + btn.join('') + '</div>' : '') +
      '</div></section>';
  }

  function glance(){
    var G = sh().glance || [];
    if (!G.length) return '';
    return '<section class="glance"><div class="in">' + G.map(function(g){
      return '<div class="cell"><div class="k">' + esc(g.label) + '</div>' +
             '<div class="v">' + esc(g.value) + '</div></div>';
    }).join('') + '</div></section>';
  }

  /* Key dates with a countdown on the next one due */
  function datesBox(){
    var D = sh().keyDates || [];
    if (!D.length) return '';
    return '<div class="box"><h3>Key dates</h3><div class="dates">' + D.map(function(d){
      var cls = d.next ? ' next' : (d.days !== null && d.days < 0 ? ' gone' : '');
      var cd  = '';
      if (d.next){
        cd = d.days === 0 ? 'today'
           : d.days === 1 ? 'tomorrow'
           : d.days + ' days to go';
      }
      return '<div class="d' + cls + '"><span class="l">' + esc(d.label) + '</span>' +
             '<span class="r">' + esc(d.display) +
             (cd ? '<span class="cd">' + cd + '</span>' : '') + '</span></div>';
    }).join('') + '</div></div>';
  }

  function includesBox(){
    var I = sh().includes || [];
    if (!I.length) return '';
    return '<div class="box"><h3>Your registration includes</h3><ul class="inc">' +
      I.map(function(x){ return '<li>' + esc(x) + '</li>'; }).join('') + '</ul></div>';
  }

  function reachBox(){
    var S = sh(), rows = [];
    if (S.email) rows.push('<a href="mailto:' + esc(S.email) + '">' +
      '<span class="ico">✉</span>' + esc(S.email) + '</a>');
    if (S.phone) rows.push('<a href="tel:' + esc(S.phone.replace(/[^0-9+]/g,'')) + '">' +
      '<span class="ico">☎</span>' + esc(S.phone) + '</a>');
    if (S.whatsapp) rows.push('<a href="https://wa.me/' + esc(S.whatsapp) +
      '" target="_blank" rel="noopener"><span class="ico">💬</span>WhatsApp us</a>');
    if (!rows.length) return '';
    return '<div class="box"><h3>Need help?</h3><div class="reach">' +
           rows.join('') + '</div></div>';
  }

  function sitefoot(){
    var L = (cfg && cfg.links) || {}, S = sh();
    var nav = navItems('').map(function(i){
      return '<a href="' + esc(i.href) + '">' + esc(i.t) + '</a>';
    }).join('');
    return '<footer class="sitefoot"><div class="in">' +
        '<div><b>' + esc(cfg.event) + '</b>' + esc(cfg.dates || '') +
          (cfg.venue ? ' &middot; ' + esc(cfg.venue) : '') + '</div>' +
        (nav ? '<nav>' + nav + '</nav>' : '') +
        '<div class="brandline">Conference platform by ' +
          '<a href="https://confhub.ng" target="_blank" rel="noopener">ConfHub</a>' +
          ' &mdash; registration, abstracts and delegate passes for ' +
          'Nigerian scientific associations.' +
          (S.email ? ' Event enquiries: <a href="mailto:' + esc(S.email) + '">' +
                     esc(S.email) + '</a>' : '') +
        '</div>' +
      '</div></footer>';
  }

  function whatsappFab(){
    var w = sh().whatsapp;
    if (!w) return '';
    return '<a class="wa" href="https://wa.me/' + esc(w) + '" target="_blank" ' +
      'rel="noopener" aria-label="Chat with the organisers on WhatsApp">' +
      '<svg viewBox="0 0 24 24"><path d="M17.47 14.38c-.3-.15-1.75-.86-2.02-.96-.27-.1-.47-.15-.67.15' +
      '-.2.3-.77.96-.94 1.16-.17.2-.35.22-.64.07-.3-.15-1.26-.46-2.4-1.48-.89-.79-1.49-1.77' +
      '-1.66-2.07-.17-.3-.02-.46.13-.61.13-.13.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.02-.52' +
      '-.07-.15-.67-1.61-.92-2.2-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.79.37-.27.3-1.04 1.01' +
      '-1.04 2.47s1.06 2.87 1.21 3.07c.15.2 2.09 3.2 5.08 4.48.71.3 1.26.49 1.69.63.71.22 1.36.19' +
      ' 1.87.12.56-.08 1.75-.71 2-1.41.25-.69.25-1.29.17-1.41-.07-.12-.27-.2-.57-.35z"/>' +
      '<path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2 22l5.25-1.38' +
      'a9.87 9.87 0 0 0 4.79 1.22h.01c5.46 0 9.91-4.45 9.91-9.91C21.96 6.45 17.5 2 12.04 2zm0' +
      ' 18.15h-.01c-1.53 0-3.03-.41-4.34-1.19l-.31-.18-3.23.85.86-3.15-.2-.33a8.2 8.2 0 0 1' +
      '-1.26-4.38c0-4.54 3.7-8.23 8.25-8.23 2.2 0 4.27.86 5.83 2.42a8.19 8.19 0 0 1 2.41 5.82' +
      'c0 4.54-3.7 8.24-8.24 8.24z"/></svg></a>';
  }

  /* Assemble. 'body' is the form panel, 'side' the sidebar boxes. */
  function page(current, opts){
    var o = opts || {};
    document.body.className = 'shelled';
    var side = o.side == null ? (datesBox() + includesBox() + reachBox()) : o.side;
    // workshops fill the whole shell; other pages centre a reading column
    var solo = side ? '' : (current === 'workshops' ? ' wide' : ' solo');
    root.innerHTML =
      '<div class="site">' +
        '<div class="topbar">' + masthead(current) + subnav(current) + '</div>' +
        hero(o.kicker, o.headline, o.ctas) +
        glance() +
        '<main class="main' + solo + '">' +
          '<div class="panel">' + (o.body || '') + '</div>' +
          (side ? '<aside class="side">' + side + '</aside>' : '') +
        '</main>' +
        sitefoot() +
      '</div>' +
      whatsappFab();
  }

  /* Loading, closed and error screens get the same frame once the
     config has landed, and a bare centred card before that. */
  function shellState(current, kicker, html){
    if (!cfg){ root.innerHTML = '<div class="bare">' + html + '</div>'; return; }
    page(current, { kicker:kicker, body:html, side:(datesBox() + reachBox()) });
  }

  function money(n){
    var sym = cfg && cfg.currency === 'NGN' ? '₦'
            : cfg && cfg.currency === 'USD' ? '$'
            : cfg && cfg.currency === 'GBP' ? '£' : '';
    var s = Number(n||0).toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    return sym ? sym + s : (cfg ? cfg.currency + ' ' + s : s);
  }

  function initials(name){
    var p = String(name||'').replace(/^(Dr|Prof|Professor|Mr|Mrs|Ms)\.?\s+/i,'')
              .trim().split(/\s+/);
    return ((p[0]||'')[0] || '') + ((p[p.length-1]||'')[0] || '');
  }

  /* "Prof L. B. Chirdan — Consultant Paediatric Surgeon, JUTH" */
  function person(entry, photo){
    var s = String(entry||'').trim();
    var i = s.indexOf('—');                    // em dash
    if (i < 0) i = s.indexOf(' - ');
    var name = i < 0 ? s : s.slice(0, i).trim();
    var role = i < 0 ? '' : s.slice(i + (s[i] === '—' ? 1 : 3)).trim();
    var face = photo
      ? '<img class="av ph" src="' + esc(photo) + '" alt="" loading="lazy">'
      : '<span class="av">' + esc(initials(name).toUpperCase()) + '</span>';
    return '<div class="p">' + face +
           '<span><span class="nm">' + esc(name) + '</span>' +
           (role ? '<span class="rl">' + esc(role) + '</span>' : '') + '</span></div>';
  }

  /* What this costs, and on what terms. A session bookable on its own is
     priced from its own rate in Fees; one that rides on a conference
     registration is priced from Extras and added to that total. */
  function priceLabel(w, own, alone, both){
    var sFee = (w.standaloneFee === null || w.standaloneFee === undefined)
                 ? null : Number(w.standaloneFee);
    if (alone && sFee !== null)
      return money(sFee) + '<small>attend this workshop only</small>';
    if (both && sFee !== null)
      return money(sFee) + '<small>on its own, or ' +
             (w.fee > 0 ? money(w.fee) + ' with the conference'
                        : 'included with the conference') + '</small>';
    if (w.fee > 0)
      return money(w.fee) + '<small>added to your conference total</small>';
    if (own)   return 'Free<small>register separately, link below</small>';
    if (alone) return 'Free<small>no conference registration needed</small>';
    return 'Included<small>with your conference registration</small>';
  }

  function bookingChip(w){
    if (w.booking === 'standalone') return '<span class="chip alone">No conference needed</span>';
    if (w.booking === 'either')     return '<span class="chip alone">Can be booked alone</span>';
    return '';
  }

  function statusChip(w){
    if (/full/i.test(w.status))
      return '<span class="chip full">Full</span>';
    if (/clos/i.test(w.status))
      return '<span class="chip closed">Closed</span>';
    if (w.placesLeft !== null && w.placesLeft <= 5)
      return '<span class="chip few">' + w.placesLeft +
             (w.placesLeft === 1 ? ' place left' : ' places left') + '</span>';
    if (w.placesLeft !== null)
      return '<span class="chip open">' + w.placesLeft + ' places left</span>';
    return '<span class="chip open">Open</span>';
  }

  function card(w){
    var when = [];
    if (w.date)  when.push('<span>📅 <b>' + esc(w.date) + '</b></span>');
    if (w.start) when.push('<span>🕒 <b>' + esc(w.start) +
                           (w.end ? ' – ' + esc(w.end) : '') + '</b></span>');
    if (w.venue) when.push('<span>📍 ' + esc(w.venue) + '</span>');
    if (w.capacity) when.push('<span>👥 ' + esc(w.capacity) + ' places</span>');

    var shut  = /full|clos/i.test(w.status);
    var alone = w.booking === 'standalone';
    var both  = w.booking === 'either';

    // a session that registers somewhere of its own - a Zoom webinar, a form -
    // sends people there instead of to the registration page
    var own = w.link ? { href:w.link, label:(w.linkText || 'Register for this workshop') } : null;

    // everything else goes to the one registration form, carrying the workshop
    // so the form can tick it and offer the right rate
    var reg = (cfg.links && cfg.links.register && cfg.links.registrationOpen)
      ? { href: cfg.links.register + (cfg.links.register.indexOf('?') > -1 ? '&' : '?') +
                'w=' + encodeURIComponent(w.id || w.title),
          label: (alone || both) ? 'Book this workshop' : 'Book with your registration' }
      : null;
    var go = !shut && (own || reg);

    return '<article class="ws' + (shut ? ' full' : '') + '">' +
      (w.flyer ? '<a class="pic" href="' + esc(w.flyer) + '" target="_blank" rel="noopener" ' +
                 'title="Open the full flyer">' +
                 '<img src="' + esc(w.flyer) + '" alt="Workshop flyer" loading="lazy"></a>' : '') +
      '<div class="in">' +
        '<div class="chips">' + bookingChip(w) + statusChip(w) + '</div>' +
        '<h3>' + esc(w.title) + '</h3>' +
        (w.tagline ? '<div class="tag">' + esc(w.tagline) + '</div>' : '') +
        (when.length ? '<div class="facts">' + when.join('') + '</div>' : '') +
        (w.about ? '<p class="body">' + esc(w.about) + '</p>' : '') +
        (w.learning.length ?
          '<h4>What you will cover</h4><ul class="learn">' +
          w.learning.map(function(x){ return '<li>' + esc(x) + '</li>'; }).join('') +
          '</ul>' : '') +
        (w.faculty.length ?
          '<h4>' + (w.faculty.length > 1 ? 'Faculty' : 'Facilitator') + '</h4>' +
          '<div class="fac">' + w.faculty.map(function(f, i){
            return person(f, (w.facultyImages || [])[i] || '');
          }).join('') + '</div>' : '') +
        '<div class="foot">' +
          '<div class="price">' + priceLabel(w, own, alone, both) + '</div>' +
          (go
            ? '<a href="' + esc(go.href) + '"' +
              (own ? ' target="_blank" rel="noopener"' : '') + '>' + esc(go.label) + '</a>'
            : '<span class="shut">' +
              (shut ? 'No places remaining' : 'Booking not open yet') + '</span>') +
        '</div>' +
      '</div></article>';
  }

  function draw(){
    var S = sh();
    var live = cfg.workshops || [];

    if (!live.length){
      page('workshops', {
        kicker:'Pre-conference workshops',
        body:'<div class="notice"><h1>No workshops listed yet</h1>' +
             '<p>The programme of pre-conference workshops for ' + esc(cfg.event) +
             ' has not been published. Please check back, or contact the organisers.</p></div>',
        side: datesBox() + reachBox()
      });
      return;
    }

    var paid = live.some(function(w){ return w.fee > 0; });

    var body =
      '<div class="ptitle">Pre-conference workshops</div>' +
      '<p class="pintro">' +
        (cfg.intro ? esc(cfg.intro)
                   : 'Hands-on sessions held before the main scientific programme. ' +
                     'Places are limited and allocated in order of registration.') +
      '</p>' +
      '<div class="wsgrid">' + live.map(card).join('') + '</div>' +
      ((cfg.links && cfg.links.register && cfg.links.registrationOpen) ?
        '<div class="howto"><h3>How to book a place</h3><ol>' +
          '<li>Open the registration form and fill in your details as usual.</li>' +
          '<li>Under <b>Optional extras</b>, tick the workshop you want.</li>' +
          '<li>' + (paid ? 'The workshop fee is added to your conference total, so you pay once.'
                         : 'Your place is held as soon as you register.') + '</li>' +
          '<li>Your place is confirmed with your delegate pass.</li>' +
        '</ol></div>' : '');

    var ctas = [];
    if (cfg.links && cfg.links.register && cfg.links.registrationOpen)
      ctas.push({ label:'Register and book a workshop', href:cfg.links.register });

    page('workshops', {
      kicker:   live.length === 1 ? 'Pre-conference workshop'
                                  : live.length + ' pre-conference workshops',
      headline: cfg.event,
      ctas:     ctas,
      body:     body,
      side:     ''                      // full width - the cards fill it
    });
  }

  /* ── load ── */
  if (!API_URL || API_URL.indexOf('PASTE') === 0){
    state('<h1>Not configured yet</h1>' +
          '<p>This page has not been connected to its spreadsheet yet.</p>' +
          '<div class="diag"><b>For the organiser:</b><br>' +
          'Near the top of <span class="mono">workshops.html</span> (line 36) this line still ' +
          'has the placeholder in it:<br><br>' +
          '<span class="mono">const API_URL = "PASTE_YOUR_EXEC_URL_HERE";</span>' +
          '<br><br>Replace the placeholder with your Web App address, which ends in ' +
          '<span class="mono">/exec</span>. Apps Script \u2192 Deploy \u2192 Manage deployments ' +
          '\u2192 copy the Web app URL. It is the same address the registration page uses.</div>');
    return;
  }

  fetch(API_URL + '?action=workshops')
    .then(function(r){
      return r.text().then(function(txt){
        if (txt.indexOf('<') === 0) throw { detail:'The Apps Script deployment is not public. ' +
          'In Apps Script: Deploy \u2192 Manage deployments \u2192 pencil \u2192 Who has access: Anyone \u2192 Deploy.' };
        var c;
        try { c = JSON.parse(txt); } catch(e){ throw { detail:'The server did not return valid data.' }; }
        if (!c || !c.ok) throw { detail:(c && c.error) || 'The engine reported an unknown problem.' };
        return c;
      });
    })
    .then(function(c){
      cfg = c;
      applyBrand(c.brand);
      if (!c.open){
        state('<h1>Workshops are not open yet</h1>' +
              '<p>The pre-conference workshops for ' + esc(c.event) +
              ' have not been announced. Please check back nearer the meeting.</p>');
        return;
      }
      draw();
    })
    .catch(function(err){
      state('<h1>Could not load the workshops</h1><p>Please contact the organisers.</p>' +
            '<div class="diag"><b>For the organiser:</b><br>' +
            esc((err && err.detail) || 'Could not reach the server.') +
            '<br><br>Test it directly by opening:<br>' +
            '<span class="mono" style="word-break:break-all">' + esc(API_URL) +
            '?action=workshops</span></div>');
    });
})();
</script>
</body>
</html>
